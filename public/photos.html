<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Photos · PerugiaParty</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#141210">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-v2.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Figtree:wght@400;500;700;800&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/site.css?v=20261023a">
<style>
/* Party photos: only for people who signed up for that party. Same calm login as /ticket. */
.ph{max-width:360px;margin:0 auto;text-align:center;padding:7vh 0 8vh}
.ph h1{font-family:var(--f-display);font-weight:400;font-size:44px;line-height:1;margin:0 0 10px}
.ph .sub{color:var(--muted);margin:0 0 22px;font-size:15px}
.ph form{display:grid;gap:10px}
.ph input{width:100%;box-sizing:border-box;text-align:left}
.ph .btn{width:100%;justify-content:center}
.ph .err{color:var(--red);font-weight:700;font-size:14px;margin:0}.ph .err:empty{display:none}
.albums{display:grid;gap:10px;margin-top:6px}
.album{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--ink);color:var(--cream);border-radius:20px;padding:20px 22px;text-decoration:none;font-family:var(--f-display);font-size:24px}
.album span{font-family:var(--f-body);font-size:14px;font-weight:700;background:var(--red);border-radius:99px;padding:9px 14px;white-space:nowrap}
.album .until{display:block;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:#b9ab98;margin-top:6px}
.album{text-align:left}
.ph .note{margin-top:18px;font-size:13.5px;color:var(--muted)}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="mark" href="/"><img src="/brand/wordmark-2.png" alt="PerugiaParty" width="851" height="160"></a>
    <nav aria-label="Main"><a class="btn" href="/ticket">My ticket</a></nav>
  </div>
</header>
<main class="wrap">
  <section class="ph" id="ph">
    <h1>Photos</h1>
    <p class="sub">For everyone who signed up for the party. Online for 7 days.</p>
    <form id="f" novalidate>
      <input id="ig" placeholder="@instagram" aria-label="Instagram" autocapitalize="off" autocomplete="username" maxlength="40">
      <input id="code" placeholder="Code (H26-XXXXXX)" aria-label="Your code" autocapitalize="characters" maxlength="20" style="font-family:var(--f-mono);letter-spacing:.06em">
      <p class="err" id="err" role="alert"></p>
      <button class="btn" type="submit" id="go">See the photos</button>
    </form>
    <p class="note">Your code is in your DMs from <a href="https://ig.me/m/perugiaparty" target="_blank" rel="noopener">@perugiaparty</a>.</p>
  </section>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
function show(albums) {
  $("ph").innerHTML = `<h1>Photos</h1><p class="sub">Thanks for coming ♥</p>
    <div class="albums">${albums.map((a) => `<a class="album" href="${esc(a.url)}" target="_blank" rel="noopener"><div>${esc(a.title)}${a.until ? `<small class="until">Online until ${new Date(a.until).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", timeZone: "Europe/Rome" })}</small>` : ""}</div><span>Open ↗</span></a>`).join("")}</div>
    <p class="note">Tag <a href="https://www.instagram.com/perugiaparty/" target="_blank" rel="noopener">@perugiaparty</a> if you post one.</p>`;
}
async function ask(body) {
  const r = await fetch("/api/photos", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body), cache: "no-store" });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "Something went wrong. Try again.");
  return d.albums || [];
}
// opened from a ticket link (?t=…) or with a saved login on this phone: no typing needed
(async () => {
  const t = new URLSearchParams(location.search).get("t");
  let me = null; try { me = JSON.parse(localStorage.getItem("pp_me") || "null"); } catch (e) {}
  if (me && me.ig) $("ig").value = me.ig;
  try {
    if (t) { show(await ask({ t })); history.replaceState(null, "", location.pathname); return; }
    let saved = null; try { saved = localStorage.getItem("pp_token"); } catch (e) {}
    if (saved && /^[A-Za-z0-9_-]{16,64}$/.test(saved)) { show(await ask({ t: saved })); return; }
  } catch (e) { /* not on the list with this phone: just show the login */ }
})();
$("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const ig = $("ig").value.trim(), code = $("code").value.trim();
  if (!ig || !code) { $("err").textContent = "Add your Instagram and your code."; return; }
  $("go").disabled = true; $("err").textContent = "";
  try { show(await ask({ ig, code })); } catch (x) { $("err").textContent = x.message; }
  finally { if ($("go")) $("go").disabled = false; }
});
</script>
</body>
</html>
