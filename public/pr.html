<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Be a PR · PerugiaParty</title>
<meta name="robots" content="noindex, follow">
<meta name="description" content="Bring new friends to PerugiaParty and your own ticket drops.">
<link rel="canonical" href="https://perugiaparty.com/pr">
<meta name="theme-color" content="#141210">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-v2.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/fonts/figtree-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/bowlby-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/site.css">
<style>
body{background:var(--cream);color:var(--ink);font-family:var(--f-body)}
.wrap{max-width:640px;margin:0 auto;padding:28px 20px 70px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}
.top img{height:34px;width:auto;display:block}
.top a{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);text-decoration:none}
.box{background:var(--ink);color:var(--cream);border-radius:26px;padding:clamp(24px,5vw,38px);display:grid;gap:18px}
.box h1{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,8vw,54px);line-height:.98;margin:0}
.box .when{font-family:var(--f-mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#b9ab98;margin:0}
.box p.lead{margin:0;font-size:16.5px;line-height:1.5;color:#cdbfa9}
.box p.lead b{color:var(--cream)}
form{display:grid;gap:15px}
label{display:grid;gap:7px;font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#b9ab98}
input{font:500 16px var(--f-body);color:var(--cream);background:#1d1815;border:1.5px solid rgba(244,234,215,.2);border-radius:14px;padding:14px 16px}
input:focus{outline:none;border-color:var(--red-glow,#ff4a3d);box-shadow:0 0 0 3px rgba(255,74,61,.18)}
button.send{justify-self:start;font:700 16px var(--f-body);border:0;border-radius:999px;padding:14px 26px;background:var(--red);color:#fff;cursor:pointer}
button.send[disabled]{opacity:.6}
.fine{font-size:13.5px;color:#b9ab98;line-height:1.5;margin:0}
.done{background:#f6f2e8;color:var(--ink);border-radius:20px;padding:24px;display:grid;gap:8px}
.done b{font-family:var(--f-display);font-weight:400;font-size:26px}
.done p{margin:0;font-size:15px;color:#6b6155;line-height:1.5}
.how{display:grid;gap:12px;margin-top:26px}
.how div{display:grid;grid-template-columns:34px 1fr;gap:14px;align-items:baseline;font-size:15.5px;line-height:1.45}
.how i{font-style:normal;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--red)}
.err{color:#ff7a6e;font-size:14px;margin:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a href="/"><img src="/brand/wordmark-5.png" alt="PerugiaParty"></a>
    <a href="/">Back to the party</a>
  </div>

  <section class="box" id="box">
    <p class="when" id="when">PerugiaParty</p>
    <h1>Be a PR.</h1>
    <p class="lead" id="deal"><b>4 new friends who pay, €5 off your ticket.</b> You come fifth.</p>
    <form id="f">
      <label>Full name<input type="text" id="name" maxlength="60" autocomplete="name" placeholder="As on your ID" required></label>
      <label>Instagram<input type="text" id="ig" maxlength="40" placeholder="@yourhandle" required></label>
      <label>How many can you bring<input type="text" id="bring" maxlength="20" placeholder="4, 8, more"></label>
      <label>Who are they<input type="text" id="who" maxlength="120" placeholder="Erasmus, my course, the gym, ..."></label>
      <p class="err" id="err" hidden></p>
      <button class="send" type="submit" id="send">Ask Miltiad</button>
    </form>
    <p class="fine">New means never been before. Once per party. Miltiad answers on Instagram.</p>
  </section>

  <div class="how">
    <div><i>01</i><span>You ask. Miltiad answers.</span></div>
    <div><i>02</i><span>You get a link and a QR.</span></div>
    <div><i>03</i><span>Who paid shows on your ticket.</span></div>
    <div><i>04</i><span>You pay last, €5 already off.</span></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const euro = n => "€" + (Number(n) % 1 ? Number(n).toFixed(2).replace(".", ",") : Number(n));

fetch("/api/event").then(r => r.json()).then(ev => {
  if (ev && ev.name) $("when").textContent = [ev.name, ev.date_label].filter(Boolean).join(" · ");
  if (ev && ev.pr_need && ev.pr_off) {
    $("deal").innerHTML = `<b>${ev.pr_need} new friends who pay, ${euro(ev.pr_off)} off your ticket.</b> You come fifth.`;
  }
}).catch(() => {});

$("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const send = $("send"), err = $("err");
  err.hidden = true;
  send.disabled = true; send.textContent = "Sending...";
  try {
    const r = await fetch("/api/pr/ask", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ name: $("name").value.trim(), ig: $("ig").value.trim(), bring: $("bring").value.trim(), who: $("who").value.trim() }) });
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error || "Something went wrong.");
    $("box").innerHTML = `<div class="done"><b>Miltiad has your request.</b>
      <p>He answers on Instagram, usually the same day. Your link then appears on your ticket.</p></div>`;
  } catch (ex) {
    err.textContent = ex.message || "Something went wrong.";
    err.hidden = false;
    send.disabled = false; send.textContent = "Ask Miltiad";
  }
});
</script>
</body>
</html>
