<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crew · PerugiaParty</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e0c0b">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-v2.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Figtree:wght@400;500;700;800&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/site.css?v=20261023a">
<style>
/* Crew: announcements, to do, things to buy, notes, my receipts, team. Money overviews stay in Matt's admin panel. */
:root{--bg:#0e0c0b;--card:#1b1715;--card2:#241f1c;--hair:#2f2825;--red:#e8392b;--go:#12a150;--warn:#ffd23f;--txt:#f4ead7;--soft:#b9ab98;--dim:#7d7064}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.app{max-width:640px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(96px + env(safe-area-inset-bottom,0px))}
.hide{display:none!important}
.mono{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0 14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:36px;height:36px;border-radius:9px;flex:none}
.brand b{display:block;font-weight:800;font-size:16px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{width:42px;height:42px;flex:none;border-radius:50%;border:1.5px solid var(--hair);background:var(--card);color:var(--soft);display:grid;place-items:center;cursor:pointer}
.icon svg{width:19px;height:19px}
/* login */
.login{min-height:70dvh;display:flex;flex-direction:column;justify-content:center;gap:12px;max-width:380px;margin:0 auto;width:100%}
.login h1{font-family:var(--f-display);font-weight:400;font-size:56px;line-height:.9;margin:0 0 4px;color:var(--txt)}
.login p.sub{margin:0 0 10px;color:var(--soft)}
input,select,textarea{font:inherit;color:var(--txt);background:var(--card);border:1.5px solid var(--hair);border-radius:14px;padding:13px 14px;width:100%;box-sizing:border-box;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--soft)}
input::placeholder,textarea::placeholder{color:var(--dim)}
.err{color:#ff8a7f;min-height:1.3em;margin:0;font-size:14px}
.big{font:inherit;font-weight:800;font-size:17px;border:0;border-radius:999px;padding:15px 20px;background:var(--red);color:#fff;cursor:pointer;width:100%}
.big:disabled{opacity:.6}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(14,12,11,.94);backdrop-filter:blur(10px);border-top:1px solid var(--hair);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs div{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tabs button{font:inherit;background:none;border:0;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;cursor:pointer;font-size:12px;font-weight:700}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-selected="true"]{color:var(--txt);background:var(--card)}
/* cards */
h2{font-family:var(--f-body);font-weight:800;font-size:26px;letter-spacing:-.01em;line-height:1.1;margin:6px 0 4px}
.lead{color:var(--soft);font-size:14px;margin:0 0 16px}
.subnav{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--card);border-radius:14px;padding:4px;margin:6px 0 16px}
.subnav button{font:inherit;font-weight:700;font-size:14px;border:0;border-radius:10px;padding:10px 6px;background:none;color:var(--soft);cursor:pointer}
.subnav button.on{background:var(--card2);color:var(--txt)}
.pin{display:inline-block;width:12px;height:12px;vertical-align:-1px;margin-right:4px;opacity:.8}
h3{font-size:13px;font-family:var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:500;margin:22px 0 8px}
.card{background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi small{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.kpi b{display:block;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi span{color:var(--soft);font-size:13px}
.meter{height:10px;border-radius:99px;background:var(--card2);overflow:hidden;margin:10px 0 6px}
.meter i{display:block;height:100%;background:var(--go);border-radius:99px;transition:width .4s}
.meter i.over{background:var(--red)}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--hair)}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .main b{display:block;font-weight:700;overflow-wrap:anywhere}
.row .main span{color:var(--soft);font-size:13px}
.row .amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;border-radius:99px;padding:3px 8px;background:var(--card2);color:var(--soft);white-space:nowrap}
.pill.ok{background:rgba(18,161,80,.18);color:#5fd893}
.pill.due{background:rgba(255,210,63,.14);color:var(--warn)}
.btn2{font:inherit;font-weight:700;font-size:14px;border-radius:999px;padding:9px 14px;border:1.5px solid var(--hair);background:var(--card2);color:var(--txt);cursor:pointer;white-space:nowrap}
.btn2.go{background:var(--go);border-color:var(--go);color:#fff}
.btn2.red{background:var(--red);border-color:var(--red);color:#fff}
.btn2.sm{padding:6px 11px;font-size:13px}
.x{background:none;border:0;color:var(--dim);font-size:20px;line-height:1;padding:6px;cursor:pointer}
.check{width:28px;height:28px;flex:none;border-radius:9px;border:2px solid var(--soft);background:none;cursor:pointer;display:grid;place-items:center;color:#fff;padding:0}
.check.on{background:var(--go);border-color:var(--go)}
.check svg{width:16px;height:16px;opacity:0}.check.on svg{opacity:1}
.row.wrap{flex-wrap:wrap}.row .full{flex-basis:100%;margin:0 0 0 40px}
.done .main b{text-decoration:line-through;color:var(--dim)}
form.add{display:grid;gap:8px}
form.add .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{font:inherit;font-weight:700;border-radius:12px;border:1.5px solid var(--hair);background:var(--card2);color:var(--soft);padding:11px 6px;cursor:pointer}
.seg button.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}
.buy{display:flex;gap:8px;margin-top:8px}
.buy input{padding:10px 12px}
.muted{color:var(--soft)}
.empty{color:var(--dim);text-align:center;padding:18px 0;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--txt);color:var(--bg);font-weight:700;font-size:14px;border-radius:99px;padding:10px 16px;z-index:9;max-width:calc(100% - 32px);text-align:center;font-family:var(--f-body);min-height:0}
.toast.bad{background:var(--red);color:#fff}
details summary{cursor:pointer;color:var(--soft);font-size:14px;padding:6px 0;list-style:none}
details summary::-webkit-details-marker{display:none}
/* sections, tap-to-open rows */
.shd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 0 8px}
.shd h3{margin:0}
.plus{font:inherit;font-weight:800;font-size:14px;border:0;border-radius:99px;padding:8px 14px;background:var(--txt);color:var(--bg);cursor:pointer;white-space:nowrap}
.plus.off{background:var(--card2);color:var(--soft)}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;border-top:1px solid var(--hair);padding:14px 0;cursor:pointer}
.list > .it:first-child .item{border-top:0}
.dot{width:30px;height:30px;flex:none;border-radius:50%;border:2px solid var(--dim);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--txt)}
.dot.mine{border-color:var(--warn);color:var(--warn)}
.dot.who{border-color:var(--soft);color:var(--soft)}
.dot.ok{background:var(--go);border-color:var(--go)}
.dot svg{width:16px;height:16px}
.item .main{flex:1;min-width:0}
.item .main b{display:block;font-weight:700;font-size:16.5px;overflow-wrap:anywhere}
.item .main span{color:var(--soft);font-size:13.5px}
.it.done .main b{text-decoration:line-through;color:var(--dim)}
.chev{color:var(--dim);flex:none;transition:transform .2s}
.it.open .chev{transform:rotate(90deg)}
.acts{display:grid;gap:8px;padding:0 0 14px 42px;margin:0;justify-content:stretch}
.acts .r{display:flex;gap:8px;flex-wrap:wrap}
.acts .r > *{flex:1 1 auto}
.yes{font:inherit;font-weight:800;font-size:16px;border:0;border-radius:14px;padding:14px;background:var(--go);color:#fff;cursor:pointer;width:100%}
.ghost{font:inherit;font-weight:700;font-size:14px;border-radius:12px;padding:11px 12px;border:1.5px solid var(--hair);background:var(--card2);color:var(--txt);cursor:pointer}
.ghost.bad{color:#ff8a7f}
.addbox{background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px;display:grid;gap:8px;border:1.5px solid var(--soft)}
.addbox .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.addbox .r{display:flex;gap:8px}.addbox .r > *{flex:1}
/* announcements */
.news{background:linear-gradient(135deg,#2a1512,#1b1715);border:1.5px solid #4a2620;border-radius:18px;padding:14px 16px;margin-bottom:10px;position:relative}
.news p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px}
.news small{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#d98b7f;margin-bottom:6px;padding-right:30px}
.news .x{position:absolute;top:8px;right:8px}
textarea{font:inherit;resize:vertical;line-height:1.5}
/* notes */
.notes{min-height:55dvh;font-size:16.5px;border-radius:18px;padding:16px;background:var(--card)}
.saved{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.saved.ok{color:#5fd893}
.pal{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.sw{border-radius:14px;overflow:hidden;background:var(--card2);border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.sw i{display:block;height:64px}
.sw span{display:block;padding:7px 10px 9px;font-weight:700;font-size:13.5px;line-height:1.25}
.sw small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--soft);font-weight:400;letter-spacing:.06em}
.shop{display:flex;align-items:center;gap:8px;margin:18px 0 8px;font-weight:800;font-size:15px}
.shop .pill{font-size:10px}
.me{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-6px 0 4px}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="brand"><img src="/apple-touch-icon.png" alt=""><div><b id="evname">Crew</b><span class="mono" id="evsub">PerugiaParty</span></div></div>
    <button class="icon hide" id="lockbtn" type="button" aria-label="Log out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
  </div>

  <form class="login" id="login" novalidate>
    <h1>Crew</h1>
    <input id="user" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Username" aria-label="Username">
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" enterkeyhint="go">
    <p class="err" id="lerr" role="alert"></p>
    <button class="big" type="submit" id="lbtn">Log in</button>
  </form>

  <main id="view" class="hide"></main>
</div>

<nav class="tabs hide" id="tabs"><div>
  <button data-tab="home" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/></svg>To do</button>
  <button data-tab="need"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14l-1.5 12h-11z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>To buy</button>
  <button data-tab="att"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c.6-3.2 3-5 6-5s5.4 1.8 6 5"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.2c2.4.2 4 1.8 4.5 4.3"/></svg>Attendance</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>More</button>
</div></nav>
<div class="toast hide" id="toast" role="status"></div>
<script>
"use strict";
// The session lives only in this variable: reload or close the page and the password is asked again.
let token = null, S = null, tab = "home", sub = "notes", busy = false, openId = null, adding = null, hiddenAt = 0, timer = null;
let noteTimer = null, noteDirty = false, noteSaving = false;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const eur = (n) => "€" + (Math.round((Number(n) || 0) * 100) / 100).toLocaleString("it-IT", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const who = (id) => { const c = S && S.crew.find((x) => x.id === id); return c ? c.name : "Ex crew"; };
const first = (n) => String(n || "").split(" ")[0];
const ini = (n) => (String(n || "?").trim()[0] || "?").toUpperCase();
const day = (t) => t ? new Date(t).toLocaleDateString("en-GB", { day: "numeric", month: "short" }) : "";
const when = (t) => { if (!t) return ""; const m = Math.round((Date.now() - t) / 60000); return m < 1 ? "just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.round(m / 60) + " h ago" : day(t); };
const hm = (t) => t ? new Date(t).toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" }) : "";
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';
const CHEV = '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';

function toast(msg, bad) {
  const t = $("#toast"); t.textContent = msg; t.className = "toast" + (bad ? " bad" : "");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add("hide"), 2600);
}
async function api(action, body = {}, keepalive) {
  const r = await fetch("/api/crew/" + action, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ ...body, token }), cache: "no-store", keepalive: !!keepalive });
  let d = {}; try { d = await r.json(); } catch (e) {}
  if (r.status === 401 && token) { lock("Session ended. Log in again."); throw new Error("relogin"); }
  if (!r.ok) throw new Error(d.error || "Something went wrong. Try again.");
  return d;
}
async function act(action, body, msg) {
  if (busy) return; busy = true;
  try { S = await api(action, body); if (msg) toast(msg); draw(); }
  catch (e) { if (e.message !== "relogin") toast(e.message, true); }
  finally { busy = false; }
}

function lock(msg) {
  if (token && noteDirty) saveNote(true);
  if (token) fetch("/api/crew/logout", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ token }), keepalive: true }).catch(() => {});
  token = null; S = null; clearInterval(timer); openId = null; adding = null;
  $("#view").classList.add("hide"); $("#view").innerHTML = ""; $("#tabs").classList.add("hide"); $("#lockbtn").classList.add("hide");
  $("#login").classList.remove("hide"); $("#pw").value = ""; $("#lerr").textContent = msg || "";
  $("#evname").textContent = "Crew"; $("#evsub").textContent = "PerugiaParty";
}
$("#login").addEventListener("submit", async (e) => {
  e.preventDefault();
  const user = $("#user").value.trim(), password = $("#pw").value;
  if (!user || !password) { $("#lerr").textContent = "Fill in your username and password."; return; }
  $("#lbtn").disabled = true; $("#lerr").textContent = "";
  try {
    const r = await fetch("/api/crew/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ user, password }), cache: "no-store" });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { $("#lerr").textContent = d.error || "Could not log in."; return; }
    token = d.token; delete d.token; S = d; $("#pw").value = "";
    $("#login").classList.add("hide"); $("#view").classList.remove("hide"); $("#tabs").classList.remove("hide"); $("#lockbtn").classList.remove("hide");
    tab = "home"; draw();
    clearInterval(timer); timer = setInterval(refresh, 20000);
  } catch (err) { $("#lerr").textContent = "No connection. Try again."; }
  finally { $("#lbtn").disabled = false; }
});
$("#lockbtn").addEventListener("click", () => lock());
// away for more than 5 minutes: ask the password again (notes are saved first)
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); if (noteDirty) saveNote(true); return; }
  if (token && hiddenAt && Date.now() - hiddenAt > 5 * 60 * 1000) lock("Locked after 5 minutes away. Log in again.");
  else if (token) refresh();
});
window.addEventListener("pagehide", () => { if (noteDirty) saveNote(true); });
async function refresh() {
  if (!token || busy || document.hidden) return;
  const a = document.activeElement;
  if ((a && /INPUT|SELECT|TEXTAREA/.test(a.tagName)) || openId || adding) return; // never redraw under someone's fingers
  try { const d = await api("state"); if (noteDirty) d.note = S.note; S = d; draw(); } catch (e) {}
}

/* ---------- notes: private, saved automatically ---------- */
async function saveNote(keepalive) {
  const ta = $("#note"); const body = ta ? ta.value : S.note.body;
  if (noteSaving && !keepalive) { noteTimer = setTimeout(() => saveNote(), 600); return; }
  noteSaving = true; setSaved("Saving…");
  try { const d = await api("note", { body }, keepalive); S.note = { body, at: d.at }; if ((ta ? ta.value : body) === body) noteDirty = false; setSaved("Saved · " + hm(d.at), true); }
  catch (e) { if (e.message !== "relogin") setSaved("Not saved · check your connection"); }
  finally { noteSaving = false; }
}
function setSaved(t, ok) { const el = $("#saved"); if (el) { el.textContent = t; el.className = "saved" + (ok ? " ok" : ""); } }
document.addEventListener("input", (e) => {
  if (e.target.id !== "note") return;
  noteDirty = true; S.note.body = e.target.value; setSaved("Typing…");
  clearTimeout(noteTimer); noteTimer = setTimeout(() => saveNote(), 800);
});

/* ---------- views ---------- */
function draw() {
  if (!S) return;
  $("#evname").textContent = S.event.name || "Crew";
  $("#evsub").textContent = [S.event.date, first(S.me.name) + (S.me.lead ? " · lead" : "")].filter(Boolean).join(" · ");
  document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  $("#view").innerHTML = tab === "need" ? needView() : tab === "att" ? attView() : tab === "more" ? moreView() : homeView();
  const f = document.querySelector("[data-autofocus]"); if (f) f.focus();
}
const list = (kind, done) => S.needs.filter((n) => (n.kind || "buy") === kind && !!Number(n.done) === done);
const plus = (k, label) => `<button class="plus ${adding === k ? "off" : ""}" data-add="${k}">${adding === k ? "Cancel" : "+ " + label}</button>`;

function itemRow(n) {
  const done = Number(n.done) === 1, mine = n.owner === S.me.id, todo = n.kind === "todo", open = openId === n.id;
  const canDel = S.me.lead || n.created_by === S.me.id;
  const dot = done ? `<span class="dot ok">${CHECK}</span>` : n.owner ? `<span class="dot ${mine ? "mine" : "who"}">${esc(ini(who(n.owner)))}</span>` : `<span class="dot"></span>`;
  const sub = [todo ? "" : n.shop ? n.shop : "", done ? (todo ? "done by " : "got it: ") + first(who(n.done_by)) : n.owner ? (mine ? "you're on it" : first(who(n.owner)) + (todo ? " is on it" : " gets it")) : ""].filter(Boolean).join(" · ");
  let acts = "";
  if (open) {
    const claim = !done && (!n.owner || mine || S.me.lead) ? `<button class="ghost" data-claim="${n.id}">${mine ? "I can't anymore" : n.owner ? "Free it up" : todo ? "I'll do it" : "I'll get it"}</button>` : "";
    const del = canDel ? `<button class="ghost bad" data-del="${n.id}">Remove</button>` : "";
    acts = done
      ? `<div class="acts"><div class="r"><button class="ghost" data-undo="${n.id}">${todo ? "Not done after all" : "Not bought after all"}</button>${del}</div></div>`
      : todo
        ? `<div class="acts"><button class="yes" data-did="${n.id}">Yes, it's done ✓</button><div class="r">${claim}${del}</div></div>`
        : `<form class="acts" data-f="got" data-id="${n.id}"><input name="price" inputmode="decimal" placeholder="€ if you paid yourself (optional)"><button class="yes">Yes, I got it ✓</button><div class="r">${claim}${del}</div></form>`;
  }
  return `<div class="it ${done ? "done" : ""} ${open ? "open" : ""}"><button class="item" data-open="${n.id}">${dot}<div class="main"><b>${esc(n.item)}${n.qty ? ` <span style="font-weight:500">× ${esc(n.qty)}</span>` : ""}</b>${sub ? `<span>${esc(sub)}</span>` : ""}</div>${CHEV}</button>${acts}</div>`;
}
function doneBlock(items, label) {
  return items.length ? `<details ${openId && items.some((n) => n.id === openId) ? "open" : ""}><summary>${label} · ${items.length} ▾</summary><div class="card list">${items.map(itemRow).join("")}</div></details>` : "";
}

function homeView() {
  const me = S.me, todo = list("todo", false), mine = todo.filter((n) => n.owner === me.id).length;
  return `<h2>To do</h2>
  <p class="lead">${todo.length ? `${todo.length} open${mine ? ` · ${mine} on you` : ""}` : "All done for now"}${me.role ? ` · your job: <b style="color:var(--txt)">${esc(me.role)}</b>` : ""}</p>
  ${S.news.length || me.lead ? `<div class="shd"><h3>Announcements</h3>${me.lead ? plus("news", "Post") : ""}</div>` : ""}
  ${adding === "news" ? `<form class="addbox" data-f="news"><textarea name="body" rows="3" maxlength="1000" placeholder="Message for the whole crew" data-autofocus></textarea><button class="big" style="padding:12px">Post to everyone</button></form>` : ""}
  ${S.news.map((x) => `<div class="news"><small>${esc(x.author || "Matt")} · ${when(x.created_at)}</small><p>${esc(x.body)}</p>${me.lead ? `<button class="x" data-delnews="${x.id}" aria-label="Remove">×</button>` : ""}</div>`).join("")}
  <div class="shd"><h3>Tasks</h3>${plus("todo", "Add")}</div>
  ${adding === "todo" ? `<form class="addbox" data-f="todo"><input name="item" placeholder="What needs to happen? e.g. Pick up the speaker" maxlength="120" data-autofocus><button class="big" style="padding:12px">Add task</button></form>` : ""}
  <div class="card list">${todo.map(itemRow).join("") || `<div class="empty">No open tasks</div>`}</div>
  ${doneBlock(list("todo", true), "Done")}`;
}

function paletteBlock() {
  const p = S.event.palette; if (!p) return "";
  return `<div class="card">${p.note ? `<p class="muted" style="margin:0 0 12px;font-size:14px">${esc(p.note)}</p>` : ""}
    <div class="pal">${p.colors.map((c) => `<button class="sw" data-hex="${esc(c.hex)}" title="Tap to copy"><i style="background:${esc(c.hex)}"></i><span>${esc(c.name || c.hex)}<small>${esc(c.hex.toUpperCase())}</small></span></button>`).join("")}</div></div>`;
}
const SHOPS = ["Lidl", "Penny", "Eurospin", "MD", "Conad", "Esselunga", "Carrefour", "Coop", "Flying Tiger", "Amazon", "From NL", "Borrow"];
function needView() {
  const open = list("buy", false);
  return `<div class="shd" style="margin-top:6px"><h2 style="margin:0">To buy</h2>${plus("buy", "Add")}</div>
  <p class="lead">${open.length} item${open.length === 1 ? "" : "s"} left · tap one when you have it</p>
  ${adding === "buy" ? `<form class="addbox" data-f="buy"><input name="item" placeholder="What do we need?" maxlength="120" data-autofocus>
    <div class="two"><input name="qty" placeholder="How many" maxlength="30"><input name="shop" list="shops" placeholder="Where? (Lidl, Penny…)" maxlength="40"></div>
    <datalist id="shops">${SHOPS.map((x) => `<option value="${x}">`).join("")}</datalist>
    <select name="cat" aria-label="Category">${S.cats.map((c) => `<option>${c}</option>`).join("")}</select>
    <button class="big" style="padding:12px">Add to list</button></form>` : ""}
  ${open.length ? groups(open).map(([shop, items]) => `<div class="shop">${esc(shop)} <span class="pill">${items.length}</span></div><div class="card list">${items.map(itemRow).join("")}</div>`).join("") : `<div class="card empty">Everything is bought</div>`}
  ${doneBlock(list("buy", true), "Got it")}`;
}
function groups(items) {
  const m = new Map();
  for (const n of items) { const k = (n.shop || "").trim() || "Anywhere"; if (!m.has(k)) m.set(k, []); m.get(k).push(n); }
  return [...m.entries()].sort((a, b) => (a[0] === "Anywhere") - (b[0] === "Anywhere") || b[1].length - a[1].length);
}

function notesView() {
  return `<div class="shd" style="margin-top:0"><p class="lead" style="margin:0">Private. Saves while you type.</p><span class="saved ${S.note.at ? "ok" : ""}" id="saved">${S.note.at ? "Saved · " + (Date.now() - S.note.at < 864e5 ? hm(S.note.at) : day(S.note.at)) : "Saves by itself"}</span></div>
  <textarea style="margin-top:10px" id="note" class="notes" maxlength="20000" placeholder="Ideas, phone numbers, what to remember for the night…">${esc(S.note.body)}</textarea>`;
}

function moreView() {
  const tabs = [["notes", "Notes"], ["spend", "Receipts"], ["pal", "Palette"]].filter(([k]) => k !== "pal" || S.event.palette);
  if (!tabs.some(([k]) => k === sub)) sub = "notes";
  return `<h2>More</h2>
  <div class="subnav" style="grid-template-columns:repeat(${tabs.length},1fr)">${tabs.map(([k, l]) => `<button data-sub="${k}" class="${sub === k ? "on" : ""}">${l}</button>`).join("")}</div>
  ${sub === "spend" ? spendView() : sub === "pal" ? paletteBlock() : notesView()}`;
}
function spendView() {
  const mine = S.spends, owed = mine.filter((x) => !Number(x.repaid)).reduce((a, x) => a + Number(x.amount || 0), 0);
  return `<div class="shd" style="margin-top:0"><p class="lead" style="margin:0">Paid yourself? Add it and Matt pays you back. Only you and Matt see this.</p>${plus("spend", "Add")}</div>
  <div style="height:10px"></div>
  ${adding === "spend" ? `<form class="addbox" data-f="spend"><input name="item" placeholder="What did you buy?" maxlength="120" data-autofocus>
    <div class="two"><input name="amount" inputmode="decimal" placeholder="€ amount"><select name="cat" aria-label="Category">${S.cats.map((c) => `<option>${c}</option>`).join("")}</select></div>
    <input name="shop" placeholder="Shop (optional)" maxlength="60"><button class="big" style="padding:12px">Add receipt</button></form>` : ""}
  <div class="card"><div class="kpi"><small>Owed to you</small><b>${eur(owed)}</b></div></div>
  <div class="card">${mine.length ? mine.map((x) => {
    const paid = Number(x.repaid) === 1;
    return `<div class="row"><div class="main"><b>${esc(x.item)}</b><span>${esc(x.cat || "Other")}${x.shop ? " · " + esc(x.shop) : ""} · ${day(x.created_at)}</span>
      <div style="margin-top:5px"><span class="pill ${paid ? "ok" : "due"}">${paid ? "Paid back" : "To pay back"}</span></div></div>
      <div class="amt">${eur(x.amount)}</div>${!paid ? `<button class="x" data-delspend="${x.id}" aria-label="Remove">×</button>` : ""}</div>`;
  }).join("") : `<div class="empty">No receipts yet</div>`}</div>`;
}

function attView() {
  const a = S.attendance, cap = S.event.capacity, going = a.paid;
  const cnt = (v) => S.crew.filter((c) => (c.going || "") === v).length;
  const label = { yes: ["Coming", "ok"], maybe: ["Maybe", "due"], no: ["Not coming", ""], "": ["No answer", ""] };
  const me = S.me;
  return `<h2>Attendance</h2>
  <p class="lead">${cnt("yes")} of ${S.crew.length} crew coming · ${going} guests paid</p>
  <h3>You</h3>
  <div class="card">
    <div class="seg">${[["yes", "Coming"], ["maybe", "Maybe"], ["no", "Can't"]].map(([v, l]) => `<button data-go="${v}" class="${me.going === v ? "on" : ""}">${l}</button>`).join("")}</div>
    <form class="buy" data-f="arrive"><input name="arrive" value="${esc(me.arrive)}" placeholder="Arriving at (e.g. 20:30)" maxlength="40"><button class="btn2">Save</button></form>
    ${me.role ? `<p class="muted" style="margin:10px 0 0;font-size:14px">Your job: <b style="color:var(--txt)">${esc(me.role)}</b></p>` : ""}
  </div>
  <h3>Guests</h3>
  <div class="card">
    <div class="grid2">
      <div class="kpi"><small>Paid · going</small><b>${going}${cap ? `<span style="font-size:16px;color:var(--dim)"> / ${cap}</span>` : ""}</b></div>
      <div class="kpi"><small>Inside now</small><b>${a.inside}</b></div>
    </div>
    ${cap ? `<div class="meter"><i style="width:${Math.min(100, (going / cap) * 100)}%"></i></div>` : ""}
    <div class="grid2" style="margin-top:12px">
      <div class="kpi"><small>Waiting to pay</small><b style="font-size:22px">${a.approved}</b></div>
      <div class="kpi"><small>New requests</small><b style="font-size:22px">${a.requested}</b></div>
    </div>
  </div>
  <h3>Crew</h3>
  <div class="card">${S.crew.map((c) => {
    const [l, k] = label[c.going || ""] || label[""];
    return `<div class="row"><div class="main"><b>${esc(c.name)} <span class="pill ${k}">${l}</span>${Number(c.lead) ? ' <span class="pill">lead</span>' : ""}</b>
      <span>${c.role ? esc(c.role) : "No job yet"}${c.arrive ? " · there at " + esc(c.arrive) : ""}</span>
      ${S.me.lead ? `<form class="buy" data-f="role" data-id="${c.id}"><input name="role" value="${esc(c.role || "")}" placeholder="Job (bar, door, DJ…)" maxlength="40"><button class="btn2 sm">Save</button></form>` : ""}</div>
      </div>`;
  }).join("")}</div>`;
}

/* ---------- actions ---------- */
document.addEventListener("click", (e) => {
  const t = e.target.closest("button"); if (!t || !token) return;
  const d = t.dataset;
  if (d.tab) { if (noteDirty) saveNote(); tab = d.tab; openId = null; adding = null; draw(); window.scrollTo(0, 0); return; }
  if (d.sub) { if (noteDirty) saveNote(); sub = d.sub; adding = null; draw(); return; }
  if (d.add) { adding = adding === d.add ? null : d.add; openId = null; draw(); return; }
  if (d.open) { const id = Number(d.open); openId = openId === id ? null : id; adding = null; draw(); return; }
  if (d.hex) { try { navigator.clipboard.writeText(d.hex.toUpperCase()); toast(d.hex.toUpperCase() + " copied"); } catch (x) {} return; }
  if (d.go) return act("me", { going: d.go, arrive: S.me.arrive }, "Saved");
  if (d.claim) { openId = null; return act("need_claim", { id: d.claim }, "Saved"); }
  if (d.did) { openId = null; return act("need_done", { id: d.did, v: true }, "Done ✓"); }
  if (d.undo) { openId = null; return act("need_done", { id: d.undo, v: false }, "Put back on the list"); }
  if (d.del) { if (confirmTwice(t)) { openId = null; act("need_del", { id: d.del }, "Removed"); } return; }
  if (d.delspend) { if (confirmTwice(t)) act("spend_del", { id: d.delspend }, "Removed"); return; }
  if (d.delnews) { if (confirmTwice(t)) act("news_del", { id: d.delnews }, "Removed"); return; }
});
// tap twice to delete (no pop-ups)
function confirmTwice(t) {
  if (t.dataset.sure) return true;
  const old = t.textContent; t.dataset.sure = "1"; t.textContent = "Sure? Tap again"; t.style.color = "#ff8a7f"; if (t.classList.contains("x")) t.style.fontSize = "13px";
  setTimeout(() => { if (t.isConnected) { delete t.dataset.sure; t.textContent = old; t.style.color = ""; t.style.fontSize = ""; } }, 3000);
  return false;
}
document.addEventListener("submit", (e) => {
  const f = e.target.closest("form[data-f]"); if (!f) return;
  e.preventDefault();
  const v = Object.fromEntries(new FormData(f).entries());
  const k = f.dataset.f;
  const need = (x) => { if (!String(x || "").trim()) { toast("Write something first", true); return false; } return true; };
  if (k === "todo") { if (!need(v.item)) return; adding = null; return act("need_add", { item: v.item, kind: "todo" }, "Added"); }
  if (k === "buy") { if (!need(v.item)) return; adding = null; return act("need_add", { ...v, kind: "buy" }, "Added to the list"); }
  if (k === "news") { if (!need(v.body)) return; adding = null; return act("news_add", { body: v.body }, "Posted to everyone"); }
  if (k === "spend") { if (!need(v.item) || !need(v.amount)) return; adding = null; return act("spend_add", v, "Receipt added"); }
  if (k === "got") { openId = null; return act("need_done", { id: Number(f.dataset.id), v: true, price: v.price }, v.price ? "Got it ✓ · added to your receipts" : "Got it ✓"); }
  if (k === "arrive") return act("me", { going: S.me.going, arrive: v.arrive }, "Saved");
  if (k === "role") return act("role", { id: Number(f.dataset.id), role: v.role }, "Job saved");
});
</script>
</body>
</html>
