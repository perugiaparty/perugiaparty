<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Door · PerugiaParty</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e0c0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-v2.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Figtree:wght@400;500;700;800&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/site.css?v=20261023a">
<script src="/notify.js?v=20261013g" defer></script>
<style>
/* Door: scan, colour, next. Built for one hand, a dark room and loud music. */
:root{--bg:#0e0c0b;--card:#1b1715;--card2:#241f1c;--hair:#2f2825;--go:#12a150;--go2:#0d7f3f;--warn:#ffd23f;--txt:#f4ead7;--soft:#b9ab98;--dim:#7d7064}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--f-body);overscroll-behavior:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.app{min-height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) 14px calc(12px + env(safe-area-inset-bottom,0px))}
.hide{display:none!important}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 2px 12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:34px;height:34px;border-radius:9px;flex:none}
.brand b{display:block;font-weight:800;font-size:16px;line-height:1.1}
.brand span{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{width:42px;height:42px;flex:none;border-radius:50%;border:1.5px solid var(--hair);background:var(--card);color:var(--soft);display:grid;place-items:center;cursor:pointer}
.icon svg{width:19px;height:19px}
.net{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.net i{width:8px;height:8px;border-radius:50%;background:var(--go)}
.net.off{color:#ff8a7f}.net.off i{background:#ff5a4f;animation:blink 1s infinite}

/* stats */
.stats{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px;margin-bottom:10px}
.st{background:var(--card);border-radius:16px;padding:10px 12px}
.st small{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.st b{display:block;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums;margin-top:2px}
.st.main b{color:var(--txt)}
.st.main b.bump{animation:bump .5s cubic-bezier(.2,1.6,.4,1)}
.prog{height:5px;border-radius:9px;background:var(--hair);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;width:0;background:var(--go);border-radius:inherit;transition:width .6s cubic-bezier(.2,.9,.3,1)}

/* camera */
.cam{position:relative;flex:1;min-height:300px;border-radius:26px;overflow:hidden;background:#050404}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .shade{position:absolute;inset:0;background:radial-gradient(ellipse 58% 42% at 50% 46%,transparent 58%,rgba(0,0,0,.55) 100%)}
.cam .brk{position:absolute;left:50%;top:46%;width:min(64%,300px);aspect-ratio:1;transform:translate(-50%,-50%)}
.cam .brk i{position:absolute;width:44px;height:44px;border:5px solid var(--txt);border-radius:4px}
.cam .brk i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-top-left-radius:22px}
.cam .brk i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-top-right-radius:22px}
.cam .brk i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-bottom-left-radius:22px}
.cam .brk i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-bottom-right-radius:22px}
.cam .line{position:absolute;left:10%;right:10%;height:3px;border-radius:3px;background:var(--red);box-shadow:0 0 16px 2px var(--red);animation:scan 2s ease-in-out infinite alternate}
.cam .hint{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:14px;font-weight:700;color:rgba(244,234,215,.9);text-shadow:0 1px 8px rgba(0,0,0,.6)}
.cam.busy .line{animation-duration:.6s}
.cam.idle .brk,.cam.idle .line,.cam.idle .hint,.cam.idle .shade{display:none}
.cam .msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:26px;background:#050404}
.cam .msg .ico{width:62px;height:62px;margin:0 auto 14px;border-radius:50%;background:var(--card2);display:grid;place-items:center}
.cam .msg .ico svg{width:28px;height:28px;color:var(--soft)}
.cam .msg h2{font-family:var(--f-body);font-weight:800;font-size:22px;margin:0 0 6px;color:var(--txt)}
.cam .msg p{margin:0 auto 18px;max-width:30ch;color:var(--soft);font-size:15px;line-height:1.45}
.big-btn{font:inherit;font-weight:800;font-size:18px;border:0;border-radius:999px;padding:16px 28px;background:var(--red);color:var(--txt);cursor:pointer;min-height:56px}
.big-btn:active{transform:scale(.97)}
.torch{position:absolute;right:12px;top:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:var(--txt);display:grid;place-items:center;cursor:pointer}
.torch svg{width:20px;height:20px}
.torch.on{background:var(--warn);color:#141210}

/* manual code */
.manual{display:flex;gap:8px;margin-top:10px}
.manual input{flex:1;min-width:0;height:56px;font-family:var(--f-body);font-size:18px;font-weight:700;background:var(--card);color:var(--txt);border:1.5px solid var(--hair);border-radius:18px;padding:0 18px;outline:none}
.manual input:focus{border-color:var(--soft)}
.manual input::placeholder{text-transform:none;letter-spacing:0;font-family:var(--f-body);font-size:16px;color:var(--dim)}
.manual button{flex:none;width:56px;height:56px;border-radius:18px;border:0;background:var(--red);color:var(--txt);display:grid;place-items:center;cursor:pointer}
.manual button svg{width:22px;height:22px}
.mhint{min-height:18px;margin:6px 4px 0;font-size:13px;font-weight:700;color:#ff8a7f}

/* recent */
.recent{margin-top:8px}
.recent h3{margin:6px 4px 6px;font-family:var(--f-mono);font-weight:400;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.recent ul{list-style:none;margin:0;padding:0;background:var(--card);border-radius:16px;overflow:hidden}
.recent li{display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--hair);font-size:14px}
.recent li:first-child{border-top:0}
.recent li i{width:10px;height:10px;border-radius:50%}
.recent li i.go{background:var(--go)}.recent li i.stop{background:#ff5a4f}.recent li i.warn{background:var(--warn)}
.recent li b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent li b em{display:none}
.recent li span{font-family:var(--f-mono);font-size:12px;color:var(--soft)}

/* login */
.login{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding-bottom:10vh}
.login .lock{width:64px;height:64px;border-radius:20px;background:var(--red);display:grid;place-items:center}
.login .lock svg{width:30px;height:30px;color:var(--txt)}
.login h1{margin:6px 0 0;font-family:var(--f-display);font-weight:400;font-size:40px;line-height:1;color:var(--txt)}
.login p{margin:0;color:var(--soft);font-size:15px}
.login input{height:58px;font:inherit;font-size:18px;background:var(--card);color:var(--txt);border:1.5px solid var(--hair);border-radius:18px;padding:0 18px;outline:none}
.login input:focus{border-color:var(--soft)}
.login .err{min-height:22px;margin:0;color:#ff8a7f;font-weight:700;font-size:15px}
.login .big-btn{width:100%}

/* verdict */
.v{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;padding:calc(30px + env(safe-area-inset-top,0px)) 24px calc(34px + env(safe-area-inset-bottom,0px));animation:vin .16s ease-out;cursor:pointer}
.v.go{background:var(--go);color:#fff}
.v.stop{background:var(--red);color:var(--txt)}
.v.warn{background:var(--warn);color:#141210}
.v .mark svg{width:104px;height:104px}
.v.go .mark circle{fill:rgba(255,255,255,.16)}
.v.go .mark path{fill:none;stroke:#fff;stroke-width:11;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:90;stroke-dashoffset:90;animation:draw .42s .05s cubic-bezier(.6,0,.2,1) forwards}
.v.stop .mark circle,.v.warn .mark circle{fill:rgba(0,0,0,.14)}
.v.stop .mark path,.v.warn .mark path{fill:none;stroke:currentColor;stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
.v.stop .inner{animation:shake .45s}
.v .inner{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:440px}
.v .kick{font-family:var(--f-mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.v .title{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(36px,10.5vw,58px);line-height:1.02;letter-spacing:-.005em;text-wrap:balance;max-width:11ch}
.v .who{margin:0;font-weight:700;font-size:clamp(24px,7vw,32px);line-height:1.1;text-wrap:balance}
.v .why{margin:0;font-size:18px;font-weight:700;opacity:.85}
.v .tapnext{position:absolute;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom,0px));margin:0;font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.6}
.v .todo{margin:2px 0 0;font-size:15px;font-weight:700;background:rgba(0,0,0,.16);border-radius:14px;padding:10px 14px;max-width:32ch}
.v.warn .todo{background:rgba(0,0,0,.08)}
.paid{display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(0,0,0,.16);border-radius:20px;padding:12px 26px}
.paid b{font-family:var(--f-display);font-weight:400;font-size:clamp(40px,13vw,56px);line-height:1}
.paid span{font-size:14px;font-weight:700;opacity:.8}
.give{font-family:var(--f-display);font-size:clamp(20px,6.5vw,28px);background:#fff;color:var(--go2);border-radius:14px;padding:10px 16px}
.v .id{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:15px;border:2px solid rgba(255,255,255,.55);border-radius:999px;padding:8px 14px}
.v .id svg{width:18px;height:18px}
.v .next{margin-top:10px;font-family:var(--f-mono);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.75}
.v .timer{position:absolute;left:0;bottom:0;height:7px;background:rgba(255,255,255,.6);animation:drain var(--t,2.2s) linear forwards}

/* name search */
.sugg{list-style:none;margin:8px 0 0;padding:0;background:var(--card);border-radius:18px;overflow:hidden;max-height:46vh;overflow-y:auto}
.sugg li button{width:100%;display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:12px;padding:13px 16px;background:none;border:0;border-top:1px solid var(--hair);color:var(--txt);font:inherit;text-align:left;cursor:pointer;min-height:56px}
.sugg li:first-child button{border-top:0}
.sugg li button:active{background:var(--card2)}
.sugg .dot{display:block;width:10px;height:10px;border-radius:50%;background:var(--dim)}
.sugg .dot.ok{background:var(--go)}.sugg .dot.in{background:var(--soft)}.sugg .dot.no{background:#ff5a4f}
.sugg b{display:block;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sugg small{display:block;font-size:12.5px;color:var(--dim)}
.sugg button>span:last-child{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.sugg .none{padding:14px 16px;color:var(--dim);font-size:14px}
/* sync + offline */
.net em{font-style:normal;margin-left:2px;color:var(--warn)}
.v .chip{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;border-radius:999px;padding:6px 12px;background:rgba(0,0,0,.2)}
.v .undo{position:absolute;right:16px;top:calc(16px + env(safe-area-inset-top,0px));font:inherit;font-weight:800;font-size:15px;border:2px solid rgba(255,255,255,.6);background:transparent;color:inherit;border-radius:999px;padding:9px 16px;cursor:pointer}
@keyframes scan{from{top:10%}to{top:88%}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes vin{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}
@keyframes drain{from{width:100%}to{width:0}}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.v.go .mark path{stroke-dashoffset:0}}
@media (max-height:700px){.stats .st b{font-size:24px}.recent{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="brand"><img src="/apple-touch-icon.png" alt=""><div><b>Door</b><span id="evname">PerugiaParty</span></div></div>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="net" id="net"><i></i><span>Online</span></span>
      <button class="icon hide" id="lockbtn" type="button" aria-label="Lock the scanner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
    </div>
  </div>

  <form class="login hide" id="login" novalidate>
    <div class="lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
    <h1>Door</h1>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Door password" aria-label="Door password" enterkeyhint="go">
    <p class="err" id="lerr" role="alert"></p>
    <button class="big-btn" type="submit" id="lbtn">Open scanner</button>
  </form>

  <section id="scan" class="hide" style="display:flex;flex-direction:column;flex:1">
    <div class="stats">
      <div class="st main"><small>Inside</small><b id="s-in">0</b><div class="prog"><i id="s-bar"></i></div></div>
      <div class="st"><small>To come</small><b id="s-wait">0</b></div>
      <div class="st"><small>Total</small><b id="s-tot">0</b></div>
    </div>
    <div class="cam idle" id="cam">
      <video id="video" playsinline muted></video>
      <div class="shade"></div>
      <div class="brk" aria-hidden="true"><i></i><i></i><i></i><i></i><b class="line"></b></div>
      <div class="hint">Scan the ticket</div>
      <button class="torch hide" id="torch" type="button" aria-label="Flashlight"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2h6l-1 7h3l-7 13 1-9H8z"/></svg></button>
      <div class="msg" id="cmsg"></div>
    </div>
    <form class="manual" id="manual" autocomplete="off" novalidate>
      <input id="code" placeholder="Code or name" aria-label="Ticket code or guest name" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
      <button type="submit" aria-label="Check in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </form>
    <ul class="sugg hide" id="sugg"></ul>
    <p class="mhint" id="mhint" role="status"></p>
    <div class="recent hide" id="recent"><h3>Last scans</h3><ul id="rlist"></ul></div>
  </section>
</div>
<div class="v hide" id="v" role="alertdialog" aria-live="assertive"></div>

<script src="/vendor/jsQR.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const euro = n => n == null ? "" : "€" + (Number(n) % 1 ? Number(n).toFixed(2).replace(".", ",") : Number(n));
const tz = { timeZone:"Europe/Rome" };
const hhmm = t => t ? new Date(Number(t)).toLocaleTimeString("it-IT", { hour:"2-digit", minute:"2-digit", ...tz }) : "";
const dayTime = t => t ? new Date(Number(t)).toLocaleString("it-IT", { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit", ...tz }) : "";
const TYPE = { early:"Early bird", normal:"Normal", late:"Late", special:"Special price", crew:"Crew" };
let PW = null, SIGN = "", stream = null, track = null, scanning = false, busy = false, lastText = "", lastAt = 0, detector = null, wake = null, lastIn = null, vTimer = null;
const ICON = {
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h2l2-2h6l2 2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  block:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M6 6l12 12"/></svg>',
  wifi:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1"/><path d="M3 3l18 18"/></svg>',
};
const MARK = {
  go:'<svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="56"/><path d="M34 62 L53 80 L88 42"/></svg>',
  stop:'<svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="56"/><path d="M40 40 L80 80 M80 40 L40 80"/></svg>',
  warn:'<svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="56"/><path d="M60 32 V68 M60 86 V87"/></svg>',
};
const ID_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="12" r="2.2"/><path d="M14 10h4M14 14h3"/></svg>';

/* ---------- network ---------- */
function setNet(){ const on = navigator.onLine; $("net").classList.toggle("off", !on); try { showSync(); } catch(e){ $("net").lastElementChild.textContent = on ? "Online" : "Offline"; } }
addEventListener("online", setNet); addEventListener("offline", setNet); setNet();
class DoorError extends Error { constructor(kind, msg){ super(msg || kind); this.kind = kind; } }
async function api(path, body){
  if (!navigator.onLine) throw new DoorError("offline");
  let r;
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 9000);
  try { r = await fetch("/api/door/" + path, { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ password: PW, ...body }), signal: ctl.signal }); }
  catch (e) { throw new DoorError(e.name === "AbortError" ? "slow" : "offline"); }
  finally { clearTimeout(to); }
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) throw new DoorError("password", d.error);
  if (r.status === 403) throw new DoorError("nopassword", d.error);
  if (r.status === 429) throw new DoorError("toomany", d.error);
  if (!r.ok) throw new DoorError("server", d.error);
  return d;
}
const NETERR = {
  offline: ["No connection", "This phone has no internet. Check Wi-Fi or mobile data, then scan again."],
  slow:    ["Too slow", "The connection is very slow and the check didn't finish. Scan again."],
  server:  ["Server problem", "The server had a problem. Scan again. If it keeps happening, tell Mattheo."],
  toomany: ["Too many tries", "Wait a few minutes, then try again."],
};

/* ---------- stats ---------- */
function stats(s){
  if (!s) return;
  const inside = Number(s.inside) || 0, wait = Number(s.waiting) || 0, tot = inside + wait, b = $("s-in");
  if (lastIn != null && inside > lastIn) { b.classList.remove("bump"); void b.offsetWidth; b.classList.add("bump"); }
  lastIn = inside; b.textContent = inside; $("s-wait").textContent = wait; $("s-tot").textContent = tot;
  $("s-bar").style.width = (tot ? Math.round(inside / tot * 100) : 0) + "%";
}

/* ---------- offline guest list + sync queue ---------- */
// codes look like PP-XXXX-XXXX; compare them without dashes, like the server does
const normCode = t => { const m = String(t || "").toUpperCase().match(/PP-?[A-Z0-9]{1,5}-?[A-Z0-9]{4}/); return (m ? m[0] : String(t || "").toUpperCase()).replace(/[^A-Z0-9]/g, ""); };
let LIST = null, QUEUE = [];
try { QUEUE = JSON.parse(localStorage.getItem("pp_door_queue") || "[]"); } catch(e){ QUEUE = []; }
try { LIST = JSON.parse(localStorage.getItem("pp_door_list") || "null"); } catch(e){ LIST = null; }
const saveQ = () => { try { localStorage.setItem("pp_door_queue", JSON.stringify(QUEUE)); } catch(e){} showSync(); };
const saveL = () => { try { localStorage.setItem("pp_door_list", JSON.stringify(LIST)); } catch(e){} };
function showSync(){ const n = QUEUE.length; $("net").lastElementChild.innerHTML = (navigator.onLine ? "Online" : "Offline") + (n ? ` <em>· ${n}</em>` : ""); $("net").title = n ? n + " check-ins waiting to sync" : ""; }
function localFind(text){
  if (!LIST) return null;
  const n = normCode(text); if (n.length < 4) return null;
  const all = LIST.guests, exact = all.find(g => g.code && g.code.replace(/-/g, "") === n);
  if (exact) return exact;
  const tail = all.filter(g => g.code && g.code.replace(/-/g, "").slice(-4) === n.slice(-4));
  return tail.length === 1 ? tail[0] : tail.length > 1 ? { ambiguous: true } : null;
}
function localPut(g){ if (!LIST || !g || !g.code) return; const i = LIST.guests.findIndex(x => x.code === g.code); const v = { code: g.code, name: g.name, ig: (i >= 0 && LIST.guests[i].ig) || "", status: g.status, crew: g.crew, receipt: g.receipt, receipt_note: g.receipt_note || "", paid_at: g.paid_at, in_at: g.in_at }; if (i >= 0) LIST.guests[i] = v; else LIST.guests.push(v); saveL(); }
async function refreshList(){ try { const d = await api("list", {}); LIST = { tag: d.tag, at: d.at, guests: d.guests }; for (const q of QUEUE) { const g = LIST.guests.find(x => x.code === q.code); if (g && g.status === "paid") { g.status = "in"; g.in_at = q.at; } } saveL(); stats(d.stats); } catch(e){} }
let syncing = false;
async function syncQueue(){
  if (syncing || !QUEUE.length || !navigator.onLine || !PW) return; syncing = true;
  try {
    const items = QUEUE.slice(0, 100), d = await api("sync", { items });
    QUEUE = QUEUE.slice(items.length); saveQ(); stats(d.stats);
    const clash = (d.results || []).filter(x => x.result !== "in" && x.result !== "already");
    for (const c of clash) addRecent({ cls: "stop", who: c.name || c.code, title: "Sync: " + c.result });
  } catch(e){} finally { syncing = false; }
}
let timers = [];
function startTimers(){ stopTimers();
  timers.push(setInterval(() => { if (navigator.onLine && PW && !busy) api("stats", {}).then(d => stats(d.stats)).catch(() => {}); }, 12000));
  timers.push(setInterval(() => { if (navigator.onLine && PW) refreshList(); }, 60000));
  timers.push(setInterval(syncQueue, 5000));
}
function stopTimers(){ timers.forEach(clearInterval); timers = []; }
addEventListener("online", () => { syncQueue(); showSync(); }); addEventListener("offline", showSync);

/* ---------- login ---------- */
function showLogin(msg){ $("login").classList.remove("hide"); $("scan").classList.add("hide"); $("lockbtn").classList.add("hide"); $("lerr").textContent = msg || ""; setTimeout(() => $("pw").focus(), 50); }
function lock(msg){ syncQueue(); PW = null; LIST = null; try { localStorage.removeItem("pp_door_pw"); localStorage.removeItem("pp_door_list"); } catch(e){} stopTimers(); stopCam(); showLogin(msg); }
$("lockbtn").addEventListener("click", () => lock(""));
const LOGINERR = {
  password: "Wrong password.",
  nopassword: "No door password set yet. Set it in the admin panel.",
  offline: "No connection.",
  slow: "Connection too slow. Try again.",
  toomany: "Too many tries. Wait a few minutes.",
  server: "Server error. Try again.",
};
$("login").addEventListener("submit", async e => {
  e.preventDefault();
  const pw = $("pw").value.trim();
  if (!pw) { $("lerr").textContent = "Type the door password first."; return; }
  PW = pw; $("lbtn").disabled = true; $("lbtn").textContent = "Opening…"; $("lerr").textContent = "";
  try { await enter(); try { localStorage.setItem("pp_door_pw", PW); } catch(e){} startCam(); }
  catch (x) { PW = null; $("lerr").textContent = LOGINERR[x.kind] || "Couldn't open the scanner. Try again."; buzz([200]); }
  finally { $("lbtn").disabled = false; $("lbtn").textContent = "Open scanner"; }
});
async function enter(){
  const d = await api("login", {});
  SIGN = d.sign || ""; $("evname").textContent = d.event || "PerugiaParty";
  stats(d.stats);
  $("login").classList.add("hide"); $("scan").classList.remove("hide"); $("lockbtn").classList.remove("hide");
  refreshList(); syncQueue(); startTimers(); showSync();
}

/* ---------- camera ---------- */
function camMsg(icon, title, text, btn){
  const m = $("cmsg"); m.classList.remove("hide"); $("cam").classList.add("idle"); $("torch").classList.add("hide");
  m.innerHTML = `<div><div class="ico">${ICON[icon]}</div><h2>${title}</h2>${text ? `<p>${text}</p>` : ""}${btn ? `<button class="big-btn" type="button" id="camgo">${btn}</button>` : ""}</div>`;
  if (btn) $("camgo").addEventListener("click", startCam);
}
async function startCam(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return camMsg("block", "Camera not supported", window.isSecureContext ? "This browser can't use the camera. Open perugiaparty.com/door in Safari or Chrome, or type the codes below." : "Open the page with https://perugiaparty.com/door to use the camera.", "");
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    const v = $("video"); v.srcObject = stream; await v.play();
    track = stream.getVideoTracks()[0];
    $("cmsg").classList.add("hide"); $("cam").classList.remove("idle");
    try { const caps = track.getCapabilities ? track.getCapabilities() : {}; $("torch").classList.toggle("hide", !caps.torch); } catch(e){}
    try { localStorage.setItem("pp_door_cam", "1"); } catch(e){}
    if ("BarcodeDetector" in window) { try { detector = new BarcodeDetector({ formats: ["qr_code"] }); } catch(e){ detector = null; } }
    if (!detector && !window.jsQR) camMsg("block", "Scanner didn't load", "The QR reader couldn't load. Reload the page, or type the codes below.", "");
    scanning = true; keepAwake(); loop();
  } catch (e) {
    const why = {
      NotAllowedError: ["Camera blocked", "Allow the camera in the browser settings."],
      SecurityError: ["Camera blocked", "Allow the camera in the browser settings."],
      NotFoundError: ["No camera found", "Type the codes below."],
      OverconstrainedError: ["Camera can't scan", "Type the codes below."],
      NotReadableError: ["Camera in use", "Close the other app using it."],
      AbortError: ["Camera stopped", ""],
    }[e && e.name] || ["Camera didn't start", ""];
    camMsg("cam", why[0], why[1], e && e.name === "NotFoundError" ? "" : "Try again");
    window.ppNotify && ppNotify("Camera not available", "warn");
  }
}
function stopCam(){ scanning = false; if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; track = null; releaseWake(); }
$("torch").addEventListener("click", async () => {
  if (!track) return; const on = !$("torch").classList.contains("on");
  try { await track.applyConstraints({ advanced: [{ torch: on }] }); $("torch").classList.toggle("on", on); } catch(e){ $("mhint").textContent = "The flashlight doesn't work on this phone."; }
});
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { stopCam(); }
  else if (PW && !$("scan").classList.contains("hide")) { let c = null; try { c = localStorage.getItem("pp_door_cam"); } catch(e){} if (c) startCam(); }
});
async function keepAwake(){ try { if ("wakeLock" in navigator) wake = await navigator.wakeLock.request("screen"); } catch(e){} }
function releaseWake(){ try { wake && wake.release(); } catch(e){} wake = null; }

let frame = 0;
const canvas = document.createElement("canvas"), ctx = canvas.getContext("2d", { willReadFrequently: true });
async function loop(){
  if (!scanning) return;
  const v = $("video");
  if (!busy && $("v").classList.contains("hide") && v.readyState >= 2) {
    let text = null;
    try {
      if (detector) { const codes = await detector.detect(v); if (codes.length) text = codes[0].rawValue; }
      else if (window.jsQR && (frame++ & 1) === 0) {
        // only the middle of the picture, where the frame is: much faster on older phones
        const vw = v.videoWidth, vh = v.videoHeight, side = Math.min(vw, vh) * .72, sx = (vw - side) / 2, sy = (vh - side) / 2, w = 420;
        canvas.width = w; canvas.height = w; ctx.drawImage(v, sx, sy, side, side, 0, 0, w, w);
        const r = jsQR(ctx.getImageData(0, 0, w, w).data, w, w, { inversionAttempts: "attemptBoth" });
        if (r) text = r.data;
      }
    } catch(e){}
    if (text && (normCode(text) !== normCode(lastText) || Date.now() - lastAt > 5000)) { lastText = text; lastAt = Date.now(); check(text); }
  }
  requestAnimationFrame(loop);
}

/* ---------- sound + vibration ---------- */
let AC = null;
function tone(seq){ try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); let t = AC.currentTime;
  for (const [f, d, type] of seq) { const o = AC.createOscillator(), g = AC.createGain(); o.type = type || "sine"; o.frequency.value = f; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.35, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .02); t += d * .9; } } catch(e){} }
function buzz(p){ try { navigator.vibrate && navigator.vibrate(p); } catch(e){} }
const FEEL = { go: () => { tone([[880,.09],[1320,.16]]); buzz([40,60,120]); }, stop: () => { tone([[220,.22,"square"],[180,.3,"square"]]); buzz([300,100,300]); }, warn: () => { tone([[520,.14,"triangle"]]); buzz([120,80,120]); } };

/* ---------- check: every scan checks the guest in straight away ---------- */
async function check(text){
  if (busy) return; busy = true; $("cam").classList.add("busy"); $("mhint").textContent = "";
  try { const d = await api("checkin", { code: text }); stats(d.stats); if (d.found && d.guest && d.guest.current) localPut(d.guest); verdict(read(d)); }
  catch (x) {
    if (x.kind === "password" || x.kind === "nopassword") { lock(LOGINERR[x.kind]); return; }
    if ((x.kind === "offline" || x.kind === "slow") && LIST) { verdict(read(offlineCheck(text))); return; }
    const t = { offline: "No connection", slow: "Too slow", toomany: "Too many tries" }[x.kind] || "Server error";
    verdict({ cls: "warn", title: t });
  }
  finally { busy = false; $("cam").classList.remove("busy"); }
}
// no internet: decide from the saved list and remember the check-in for later
function offlineCheck(text){
  const g = localFind(text);
  if (!g) return { found: false, offline: true };
  if (g.ambiguous) return { found: false, ambiguous: true, offline: true };
  const v = { ...g, current: true };
  if (g.status === "paid") {
    g.status = "in"; g.in_at = Date.now(); saveL();
    QUEUE.push({ code: g.code, at: g.in_at }); saveQ();
    return { found: true, fresh: true, offline: true, guest: { ...v, status: "in", in_at: g.in_at } };
  }
  return { found: true, offline: true, guest: v };
}
function paidBox(g){
  // never show what the guest paid: the door only sees the venue's receipt amount, the same for everyone
  if (g.receipt != null) return `<div class="paid"><span>Scontrino</span><b>${esc(euro(g.receipt))}</b><span>${esc(g.receipt_note || "paid in advance")}</span></div>`;
  return `<div class="paid"><b>${g.crew ? "Crew" : "Paid"}</b><span>in advance</span></div>`;
}
// every answer from the server as one short screen
function read(d){
  if (!d.found && d.ambiguous) return { cls: "warn", title: "Type the full code" };
  if (!d.found) return d.offline ? { cls: "warn", title: "Not in saved list", offline: true } : { cls: "stop", title: "Not on the list", why: "Send to Miltiad" };
  const g = d.guest, who = g.name;
  if (!g.current) return { cls: "stop", title: "Wrong party", who, why: esc(g.event) };
  if (g.status === "in" && d.fresh) return { cls: "go", title: g.crew ? "Crew" : "In", who, paid: paidBox(g), give: SIGN, auto: 2600, undo: g.code, offline: d.offline };
  const S = {
    in:       { title: "Already in", why: "Since " + esc(hhmm(g.in_at)), paid: paidBox(g) },
    approved: { title: "Not paid", why: "Send to Miltiad" },
    requested:{ title: "Not approved", why: "Send to Miltiad" },
    waitlist: { title: "Waitlist", why: "Send to Miltiad" },
    declined: { title: "Declined" },
    released: { title: "Place released", why: "Send to Miltiad" },
    removed:  { title: "Removed", why: "Send to Miltiad" },
  }[g.status];
  if (g.status === "paid") return { cls: "warn", title: "Scan again", who };
  return { cls: "stop", who, offline: d.offline, ...(S || { title: "No entry", why: "Send to Miltiad" }) };
}
function verdict(o){
  const V = $("v"); clearTimeout(vTimer);
  V.className = "v " + o.cls;
  V.innerHTML = `${o.undo ? `<button class="undo" type="button" id="undo">Undo</button>` : ""}<div class="inner"><div class="mark">${MARK[o.cls]}</div>${o.offline ? `<span class="chip">Offline</span>` : ""}<p class="title">${o.title}</p>${o.who ? `<p class="who">${esc(o.who)}</p>` : ""}${o.paid || ""}${o.give ? `<p class="give">Give: ${esc(o.give)}</p>` : ""}</div>${o.auto ? `<div class="timer" style="--t:${o.auto}ms"></div>` : `<p class="tapnext">Tap to continue</p>`}`;
  V.classList.remove("hide");
  FEEL[o.cls] && FEEL[o.cls]();
  if (!o.noRecent) addRecent(o);
  if (o.auto) vTimer = setTimeout(closeV, o.auto);
  if (o.undo) $("undo").addEventListener("click", e => { e.stopPropagation(); undo(o.undo, o.offline); });
}
async function undo(code, offline){
  clearTimeout(vTimer);
  const qi = QUEUE.findIndex(q => q.code === code);
  if (qi >= 0) { QUEUE.splice(qi, 1); saveQ(); const g = LIST && LIST.guests.find(x => x.code === code); if (g) { g.status = "paid"; g.in_at = null; saveL(); } done(); return; }
  try { const d = await api("undo", { code }); stats(d.stats); if (d.guest) localPut(d.guest); if (d.undone) done(); else verdict({ cls: "warn", title: "Can't undo" }); }
  catch(e){ verdict({ cls: "warn", title: "Can't undo" }); }
  function done(){ RECENT.shift(); closeV(); verdict({ cls: "warn", title: "Undone", auto: 1400, noRecent: true }); }
}
function closeV(){ clearTimeout(vTimer); $("v").classList.add("hide"); lastText = ""; }
$("v").addEventListener("click", closeV);

/* ---------- last scans ---------- */
const RECENT = [];
function addRecent(o){
  RECENT.unshift({ cls: o.cls, who: o.who || "Unknown code", what: o.title, at: Date.now() }); RECENT.length = Math.min(RECENT.length, 4);
  renderRecent();
}
function renderRecent(){
  $("recent").classList.toggle("hide", !RECENT.length);
  $("rlist").innerHTML = RECENT.map(r => `<li><i class="${r.cls}"></i><b>${esc(r.who)}<em>${esc(r.what)}</em></b><span>${esc(hhmm(r.at))}</span></li>`).join("");
}

/* ---------- manual: code or name ---------- */
const fold = t => String(t || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/^@/, "");
const looksLikeCode = v => /^pp/i.test(v) || (/\d/.test(v) && /^[a-z0-9-]{4,}$/i.test(v));
const ST_LABEL = { paid: "Paid", in: "Inside", approved: "Not paid", requested: "Not approved", waitlist: "Waitlist", declined: "Declined", released: "Released", removed: "Removed" };
let MATCH = [];
function suggest(){
  const v = $("code").value.trim(), box = $("sugg");
  if (!LIST || v.length < 2 || looksLikeCode(v)) { box.classList.add("hide"); MATCH = []; return; }
  const q = fold(v);
  MATCH = LIST.guests.filter(g => fold(g.name).includes(q) || fold(g.ig).includes(q))
    .sort((a, b) => (a.status === "paid" ? 0 : a.status === "in" ? 1 : 2) - (b.status === "paid" ? 0 : b.status === "in" ? 1 : 2) || fold(a.name).localeCompare(fold(b.name))).slice(0, 6);
  box.innerHTML = MATCH.length ? MATCH.map((g, i) => `<li><button type="button" data-i="${i}"><span class="dot ${g.status === "paid" ? "ok" : g.status === "in" ? "in" : "no"}"></span><div><b>${esc(g.name)}</b><small>${esc(g.ig ? "@" + String(g.ig).replace(/^@/, "") : g.code)}</small></div><span>${esc(ST_LABEL[g.status] || g.status)}</span></button></li>`).join("") : `<li class="none">No guest with this name</li>`;
  box.classList.remove("hide");
}
$("code").addEventListener("input", () => { $("mhint").textContent = ""; suggest(); });
$("sugg").addEventListener("click", e => { const b = e.target.closest("[data-i]"); if (!b) return; const g = MATCH[+b.dataset.i]; pick(g.code); });
function pick(code){ $("code").value = ""; $("code").blur(); $("sugg").classList.add("hide"); MATCH = []; check(code); }
$("manual").addEventListener("submit", e => {
  e.preventDefault();
  const v = $("code").value.trim().replace(/\s+/g, " ");
  if (!v) { $("mhint").textContent = "Type a code or name."; buzz(60); return; }
  if (!looksLikeCode(v)) { if (MATCH.length === 1) return pick(MATCH[0].code); $("mhint").textContent = MATCH.length ? "Tap the right person." : LIST ? "No guest with this name." : "Type the code."; buzz(60); return; }
  if (v.replace(/[^a-z0-9]/gi, "").length < 4) { $("mhint").textContent = "Code too short."; buzz(60); return; }
  pick(v.replace(/\s+/g, ""));
});

/* ---------- boot ---------- */
(async () => {
  try { PW = localStorage.getItem("pp_door_pw"); } catch(e){}
  if (!PW) return showLogin();
  try { await enter(); let cam = null; try { cam = localStorage.getItem("pp_door_cam"); } catch(e){} if (cam) startCam(); else camMsg("cam", "Ready", "", "Start scanning"); }
  catch (x) { PW = null; if (x.kind === "password") { try { localStorage.removeItem("pp_door_pw"); } catch(e){} } showLogin(LOGINERR[x.kind] || ""); }
})();
</script>
