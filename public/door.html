<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Door · PerugiaParty</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#141210">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-v2.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Figtree:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/site.css">
<script src="/notify.js" defer></script>
<style>
/* Door scanner: dark, one-handed, big verdicts. Built for a phone at night. */
body{background:var(--ink);color:var(--cream)}
main{padding-block:16px 40px;max-width:520px;margin-inline:auto}
.top2{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:12px}
.top2 .mark{font-size:19px}
.lock{font:inherit;font-size:13px;font-weight:700;color:var(--muted-dark);background:transparent;border:1.5px solid #3a3330;border-radius:999px;padding:6px 12px;cursor:pointer}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stats div{background:var(--ink-2);border-radius:14px;padding:10px 12px}
.stats b{display:block;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-dark)}
.cam{position:relative;border-radius:22px;overflow:hidden;background:#000;aspect-ratio:1/1;max-width:100%}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .frame{position:absolute;inset:16%;border:4px solid rgba(244,234,215,.9);border-radius:22px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.cam .msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted-dark);font-size:15px}
.cam .msg .btn{margin-top:12px}
.manual{display:flex;gap:8px;margin-top:12px}
.manual input{font-family:var(--f-mono);font-size:18px;letter-spacing:.06em;text-transform:uppercase;background:var(--ink-2);color:var(--cream);border-color:#3a3330}
.manual .btn{flex:none}
.verdict{position:fixed;inset:0;z-index:20;display:grid;align-content:center;gap:14px;padding:28px 22px calc(28px + env(safe-area-inset-bottom,0px));text-align:center}
.verdict.go{background:#1f7a3d;color:#fff}
.verdict.stop{background:var(--red);color:var(--cream)}
.verdict.hold{background:#f4ead7;color:var(--ink)}
.verdict .big{font-family:var(--f-display);font-size:clamp(40px,12vw,64px);line-height:1}
.verdict .who{font-size:24px;font-weight:700}
.verdict .sub{font-size:16px;opacity:.9;max-width:34ch;margin-inline:auto}
.verdict .code{font-family:var(--f-mono);font-size:18px;letter-spacing:.08em;opacity:.85}
.verdict .sign{font-family:var(--f-display);font-size:clamp(26px,8vw,38px);background:rgba(0,0,0,.2);border-radius:16px;padding:14px 18px;justify-self:center}
.verdict .row{display:grid;gap:10px;margin-top:6px}
.verdict .btn{font-size:18px;padding:16px 24px;width:100%}
.verdict .btn.light{background:#fff;border-color:#fff;color:#1f7a3d}
.verdict .btn.ghost{background:transparent;border-color:currentColor;color:inherit}
.verdict .icon{font-size:64px;line-height:1}
.login{display:grid;gap:14px;padding-top:30px}
.login h1{font-size:44px;color:var(--cream)}
.login p{color:var(--muted-dark)}
.login input{background:var(--ink-2);color:var(--cream);border-color:#3a3330;font-size:18px}
.err{color:#ff8a7f;font-weight:700;min-height:1.4em}
.opt{display:flex;gap:10px;align-items:center;margin-top:12px;color:var(--muted-dark);font-size:14px}
.opt input{width:20px;height:20px;accent-color:var(--red)}
</style>
</head>
<body>
<main class="wrap">
  <div class="top2"><span class="mark">Perugia<span>Party</span> · Door</span><button class="lock" id="lock" hidden>Lock</button></div>

  <form class="login" id="login" hidden>
    <h1>Door check-in</h1>
    <p>Enter the door password you set in the admin panel.</p>
    <label for="pw" style="color:var(--cream)">Door password<input id="pw" type="password" autocomplete="current-password" required></label>
    <p class="err" id="lerr" role="alert"></p>
    <button class="btn" type="submit" id="lbtn">Open scanner</button>
  </form>

  <section id="scan" hidden>
    <p id="evname" style="color:var(--muted-dark);margin-bottom:10px"></p>
    <div class="stats"><div><b id="s-in">0</b><span>Inside</span></div><div><b id="s-wait">0</b><span>Still to arrive</span></div></div>
    <div class="cam" id="cam">
      <video id="video" playsinline muted></video>
      <div class="frame" aria-hidden="true"></div>
      <div class="msg" id="cmsg"><div><p>Point the camera at the guest's QR code.</p><button class="btn" type="button" id="start">Start camera</button></div></div>
    </div>
    <form class="manual" id="manual" autocomplete="off"><input id="code" placeholder="Type code or last 4" aria-label="Guest code"><button class="btn" type="submit">Check</button></form>
    <label class="opt" for="auto"><input type="checkbox" id="auto"> Check in automatically when a paid ticket is scanned</label>
  </section>
</main>
<div class="verdict" id="verdict" hidden role="alertdialog" aria-live="assertive"></div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const euro = n => n == null ? "" : "€" + (Number(n) % 1 ? Number(n).toFixed(2).replace(".", ",") : Number(n));
const hhmm = t => t ? new Date(Number(t)).toLocaleTimeString("it-IT", { hour:"2-digit", minute:"2-digit", timeZone:"Europe/Rome" }) : "";
let PW = null, SIGN = "", stream = null, scanning = false, busy = false, lastText = "", lastAt = 0, detector = null;
try { $("auto").checked = localStorage.getItem("pp_door_auto") === "1"; } catch(e){}
$("auto").addEventListener("change", () => { try { localStorage.setItem("pp_door_auto", $("auto").checked ? "1" : "0"); } catch(e){} });

async function api(path, body){
  const r = await fetch("/api/door/" + path, { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ password: PW, ...body }) });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 || r.status === 403) { lock(d.error); throw new Error("auth"); }
  if (!r.ok) throw new Error(d.error || "Couldn't reach the server.");
  return d;
}
function stats(s){ if (!s) return; $("s-in").textContent = s.inside; $("s-wait").textContent = s.waiting; }

/* login */
function showLogin(msg){ $("login").hidden = false; $("scan").hidden = true; $("lock").hidden = true; $("lerr").textContent = msg || ""; $("pw").focus(); }
function lock(msg){ PW = null; try { localStorage.removeItem("pp_door_pw"); } catch(e){} stopCam(); showLogin(msg); }
$("lock").addEventListener("click", () => lock(""));
$("login").addEventListener("submit", async e => {
  e.preventDefault();
  PW = $("pw").value; $("lbtn").disabled = true;
  try { await enter(); try { localStorage.setItem("pp_door_pw", PW); } catch(e){} }
  catch (x) { if (x.message !== "auth") { const m = x.message === "Failed to fetch" ? "No connection. Check the internet on this phone." : x.message; $("lerr").textContent = m; window.ppNotify && ppNotify(/connection/i.test(m) ? "No connection" : "Couldn't open scanner", "error"); } }
  finally { $("lbtn").disabled = false; }
});
async function enter(){
  const d = await api("login", {});
  SIGN = d.sign || ""; $("evname").textContent = (d.event || "") + (SIGN ? " · sign: " + SIGN : "");
  stats(d.stats);
  $("login").hidden = true; $("scan").hidden = false; $("lock").hidden = false;
}

/* camera */
async function startCam(){
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false });
    const v = $("video"); v.srcObject = stream; await v.play();
    $("cmsg").hidden = true;
    if ("BarcodeDetector" in window) { try { detector = new BarcodeDetector({ formats: ["qr_code"] }); } catch(e){ detector = null; } }
    scanning = true; loop();
  } catch (e) {
    $("cmsg").hidden = false;
    const why = {
      NotAllowedError: "Camera blocked. Allow camera access for perugiaparty.com in your browser settings, then try again.",
      NotFoundError: "No camera found on this device. Type the codes below instead.",
      NotReadableError: "Another app is using the camera. Close it, then try again.",
      OverconstrainedError: "This camera can't be used for scanning. Type the codes below instead.",
    }[e && e.name] || (navigator.mediaDevices ? "The camera didn't start. Try again, or type the code below." : "This browser can't use the camera. Open perugiaparty.com/door in Safari or Chrome, or type the codes below.");
    $("cmsg").innerHTML = `<div><p>${why}</p><button class="btn" type="button" id="start">Try again</button></div>`;
    window.ppNotify && ppNotify("Camera not available", "warn");
    $("start").addEventListener("click", startCam);
  }
}
function stopCam(){ scanning = false; if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; }
$("start").addEventListener("click", startCam);
const canvas = document.createElement("canvas"), ctx = canvas.getContext("2d", { willReadFrequently: true });
async function loop(){
  if (!scanning) return;
  const v = $("video");
  if (!busy && $("verdict").hidden && v.readyState >= 2) {
    let text = null;
    try {
      if (detector) { const codes = await detector.detect(v); if (codes.length) text = codes[0].rawValue; }
      else if (window.jsQR) {
        const w = 480, h = Math.round(w * v.videoHeight / v.videoWidth) || 480;
        canvas.width = w; canvas.height = h; ctx.drawImage(v, 0, 0, w, h);
        const img = ctx.getImageData(0, 0, w, h); const r = jsQR(img.data, w, h, { inversionAttempts: "dontInvert" });
        if (r) text = r.data;
      }
    } catch(e){}
    if (text && (text !== lastText || Date.now() - lastAt > 4000)) { lastText = text; lastAt = Date.now(); check(text); }
  }
  requestAnimationFrame(loop);
}

/* check + verdicts */
async function check(text, forceCheckin){
  if (busy) return; busy = true;
  try {
    const auto = forceCheckin || $("auto").checked;
    let d = await api("check", { code: text });
    if (d.found && d.guest.current && d.guest.status === "paid" && auto) d = await api("checkin", { code: text });
    stats(d.stats); show(d, text);
  } catch (x) { if (x.message !== "auth") show({ error: x.message === "Failed to fetch" ? "No connection. Check the internet on this phone, then scan again." : x.message }, text); }
  finally { busy = false; }
}
function buzz(p){ try { navigator.vibrate && navigator.vibrate(p); } catch(e){} }
function show(d, text){
  const V = $("verdict"); let cls = "stop", html = "";
  const next = `<button class="btn ghost" type="button" data-next>Next guest</button>`;
  if (d.error) html = `<div class="icon">⚠</div><p class="big">Try again</p><p class="sub">${esc(d.error)}</p><div class="row">${next}</div>`;
  else if (!d.found) html = `<div class="icon">✕</div><p class="big">Not on the list</p><p class="sub">${d.ambiguous ? "Several codes end like this. Type the full code." : "No ticket with this code. Check the code or the guest's ticket page."}</p><p class="code">${esc(String(text).slice(0, 60))}</p><div class="row">${next}</div>`;
  else {
    const g = d.guest;
    if (!g.current) html = `<div class="icon">✕</div><p class="big">Wrong party</p><p class="who">${esc(g.name)}</p><p class="sub">This ticket is for ${esc(g.event)}.</p><div class="row">${next}</div>`;
    else if (g.status === "in" && d.fresh) { cls = "go"; html = `<div class="icon">✓</div><p class="big">Let in</p><p class="who">${esc(g.name)}</p><p class="code">${esc(g.code)}</p>${g.sign ? `<p class="sign">Give: ${esc(g.sign)}</p>` : ""}<p class="sub">Check their photo ID matches the name.</p><div class="row"><button class="btn light" type="button" data-next>Next guest</button></div>`; }
    else if (g.status === "in") html = `<div class="icon">✕</div><p class="big">Already inside</p><p class="who">${esc(g.name)}</p><p class="sub">This ticket was used at ${esc(hhmm(g.in_at))}. Don't let in twice.</p><p class="code">${esc(g.code)}</p><div class="row">${next}</div>`;
    else if (g.status === "paid") { cls = "hold"; html = `<p class="sub" style="font-family:var(--f-mono);letter-spacing:.1em;text-transform:uppercase">Paid · ${esc(euro(g.price))}</p><p class="who" style="font-size:30px">${esc(g.name)}</p><p class="code">${esc(g.code)}</p><p class="sub">Check their photo ID, then let them in.</p><div class="row"><button class="btn" type="button" data-in="${esc(g.code)}">Let in</button><button class="btn ghost" type="button" data-next>Cancel</button></div>`; }
    else if (g.status === "approved") html = `<div class="icon">✕</div><p class="big">Not paid</p><p class="who">${esc(g.name)}</p><p class="sub">Approved, but the payment of ${esc(euro(g.price))} hasn't been confirmed. Check in the admin panel.</p><div class="row">${next}</div>`;
    else html = `<div class="icon">✕</div><p class="big">No entry</p><p class="who">${esc(g.name)}</p><p class="sub">This request is ${esc(g.status)}.</p><div class="row">${next}</div>`;
  }
  V.className = "verdict " + cls; V.innerHTML = html; V.hidden = false;
  buzz(cls === "go" ? 120 : cls === "hold" ? [60, 60, 60] : [300, 100, 300]);
}
$("verdict").addEventListener("click", e => {
  const inBtn = e.target.closest("[data-in]");
  if (inBtn) { $("verdict").hidden = true; check(inBtn.dataset.in, true); return; }
  if (e.target.closest("[data-next]")) { $("verdict").hidden = true; lastText = ""; }
});
$("manual").addEventListener("submit", e => { e.preventDefault(); const v = $("code").value.trim(); if (v) { check(v); $("code").value = ""; } });

/* boot */
(async () => {
  try { PW = localStorage.getItem("pp_door_pw"); } catch(e){}
  if (!PW) return showLogin();
  try { await enter(); } catch (x) { if (x.message !== "auth") showLogin(x.message); }
})();
</script>
</body>
</html>
