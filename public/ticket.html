<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My ticket · PerugiaParty</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#141210">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-v2.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" id="mf" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PerugiaParty">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Figtree:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/site.css?v=20261023a">
<script src="/notify.js?v=20261013g" defer></script>
<style>
main{padding-block:44px 80px}
.page{max-width:620px;margin-inline:auto;display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.page > *{min-width:0}
.page h1,.page h2{overflow-wrap:normal}
.state{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;border-radius:999px;padding:5px 12px;background:var(--cream-2);border:1.5px solid var(--ink)}
.state.ok{background:var(--red);border-color:var(--red);color:var(--cream)}
h1{font-size:clamp(40px,8vw,64px)}
.lead{font-size:18px;color:var(--muted);max-width:46ch}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:20px;padding:22px;display:grid;gap:14px}
.row{display:grid;grid-template-columns:130px 1fr auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px}
.row:last-child{border-bottom:0;padding-bottom:0}
.row dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.row dd{margin:0;font-weight:700;overflow-wrap:anywhere;min-width:0}
.row dd.mono{font-family:var(--f-mono);font-weight:500;letter-spacing:.04em}
.copy{font:inherit;font-size:13px;font-weight:700;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;cursor:pointer}
.copy:hover{border-color:var(--ink)}
@media (max-width:520px){.row{grid-template-columns:1fr auto}.row dt{grid-column:1/-1}}
.deadline{background:var(--ink);color:var(--cream);border-radius:16px;padding:16px 18px;font-weight:700}
.deadline span{color:#ff8a7f}
.ticket{background:var(--ink);color:var(--cream);border-radius:24px;padding:26px;display:grid;gap:18px;justify-items:center;text-align:center;box-shadow:12px 12px 0 var(--red)}
.ticket .logo{width:170px}
.ticket .ev{font-family:var(--f-display);font-size:30px;line-height:1.05}
.ticket .meta{color:var(--muted-dark);font-size:15px}
.qr{background:var(--cream);padding:14px;border-radius:16px;width:min(260px,70vw)}
.qr canvas{width:100%;height:auto;display:block;image-rendering:pixelated}
.ticket .code{font-family:var(--f-mono);font-size:26px;letter-spacing:.1em}
.ticket .who{font-weight:700;font-size:18px}
.loc{background:var(--red);color:var(--cream);border-radius:20px;padding:20px 22px;display:grid;gap:6px}
.loc p{font-size:20px;font-weight:700}
.loc a{color:var(--cream)}
.note{font-size:14px;color:var(--muted)}
.empty{text-align:center;padding:40px 10px;display:grid;gap:14px;justify-items:center}
/* accepted landing */
.hero-ok{background:var(--red);color:var(--cream);border-radius:24px;padding:28px;display:grid;gap:10px}
.hero-ok h1{color:var(--cream)}
.hero-ok .state{justify-self:start}
.hero-ok .lead{color:#f3d3cc}
.amount{background:var(--ink);color:var(--cream);border-radius:22px;padding:24px;display:grid;gap:6px}
.amount .big{font-family:var(--f-display);font-size:clamp(48px,11vw,72px);line-height:1;color:var(--cream)}
.amount .why{color:var(--muted-dark);font-size:15px;max-width:46ch}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tier{border:1.5px solid #3a3330;border-radius:14px;padding:10px 12px;color:var(--muted-dark);font-size:14px}
.tier b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px;color:var(--muted-dark)}
.tier.me{border-color:var(--cream);background:var(--ink-2);color:var(--cream)}
.tier.me b{color:var(--cream)}
.tier .tn,.tier .tu{display:block}
.tier .tu{font-size:12px;opacity:.8}
.tier .you{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#ff8a7f}
.howto{list-style:none;margin:0;padding:0;counter-reset:h;display:grid;gap:16px}
.howto li{counter-increment:h;display:grid;grid-template-columns:40px 1fr;gap:14px;align-items:start}
.howto li::before{content:counter(h);display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--red);color:var(--cream);font-family:var(--f-display);font-size:18px}
.howto h3{font-size:20px;margin-bottom:4px}
.howto p{color:var(--muted);font-size:15px}
.ref{font-family:var(--f-mono);font-size:18px;background:var(--ink);color:var(--cream);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;overflow-wrap:anywhere}
.ref .copy{color:var(--cream);border-color:#4a423b}
.copyall{justify-self:start}
.state{justify-self:start}
/* one theme: pills take their colour from the card they sit on */
.page > .state,.card .state{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.rq .state,.hype .state,.pay .state{background:var(--red);border-color:var(--red);color:var(--cream)}
.hero-ok .state,.hype.paid .state,.thanks .state,.where .state{background:var(--cream);border-color:var(--cream);color:var(--red)}
.wl-tag{justify-self:start;background:var(--cream);color:var(--red);font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:4px 10px}
/* paid */
.hype.paid{background:var(--red)}
.hype.paid h1{color:var(--cream);padding-right:70px}
.hype.paid .lead{color:#f3d3cc}
.hype.paid .lead b{color:var(--cream)}
.hype.paid .count div{background:rgba(20,18,16,.22)}
.hype.paid .count span{color:#f3d3cc}
.rq-stamp.paid-stamp{color:var(--cream);border-color:var(--cream);font-size:16px;animation-delay:.25s}
.cine.shine{overflow:hidden}
.cine.shine::after{content:"";position:absolute;inset:-40% -60%;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.14) 50%,transparent 58%);transform:translateX(-60%);animation:shine 3.2s 1s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%{transform:translateX(-60%)}55%,100%{transform:translateX(60%)}}
.page .where{background:var(--ink)}
.page .where .eyebrow.unl{color:#ff8a7f}
.page .where .btn{background:var(--red);border-color:var(--red);color:var(--cream)}
.page .actions{grid-template-columns:1fr 1fr}
.actions .btn.wide{grid-column:1/-1}
.unlock{position:fixed;inset:0;z-index:998;background:var(--red);color:var(--cream);display:grid;place-items:center;text-align:center;padding:24px;cursor:pointer;animation:unIn .35s ease-out both}
.unlock.out{animation:unOut .45s ease-in forwards}
.unlock-in{display:grid;gap:14px;justify-items:center}
.unlock-k{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;background:var(--cream);color:var(--red);border-radius:999px;padding:5px 12px;animation:pop .4s .15s both}
.unlock-h{font-family:var(--f-display);font-size:clamp(64px,20vw,120px);line-height:.9;margin:0;animation:bigIn .6s .25s cubic-bezier(.2,1.5,.4,1) both}
.unlock-t{font-size:14px;color:#f3d3cc;animation:unIn .4s 1s both}
@keyframes unIn{from{opacity:0}to{opacity:1}}
@keyframes unOut{to{opacity:0;transform:translateY(-30px)}}
@keyframes bigIn{from{opacity:0;transform:scale(.4) rotate(-6deg)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.unlock,.unlock *,.cine.shine::after{animation:none!important}}
.tsave{position:fixed;inset:0;z-index:997;background:var(--ink);display:grid;place-items:center;padding:16px;overflow:auto}
.tsave-in{display:grid;gap:12px;justify-items:center;max-width:420px;width:100%;text-align:center}
.tsave-h{color:var(--cream);font-weight:700;font-size:17px;margin:0}
.tsave img{width:100%;max-height:68vh;object-fit:contain;border-radius:12px;-webkit-touch-callout:default;user-select:auto}
.tsave-n{color:var(--muted-dark);font-size:13px;margin:0;max-width:36ch}
.tsave .btn{min-width:140px}
.cine .crewband{position:absolute;top:26px;right:-44px;transform:rotate(35deg);background:var(--red);color:var(--cream);font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;padding:6px 52px;z-index:2}
.cine.crew{overflow:hidden;box-shadow:10px 10px 0 var(--ink),10px 10px 0 2px var(--red)}
.rq.pending{border:3px solid #ff4a3d}
.rq.pending .state{background:#ff4a3d;border-color:#ff4a3d;color:var(--ink)}
.rq.pending .lead b{color:var(--cream)}
.rq.pending .vcode{margin-top:4px}
.rq.pending .pend-go{width:100%;font-size:18px;padding:16px 22px}
.rq.pending .pend-n{font-size:14px;color:var(--muted-dark);margin:0}
.rq.pending .pend-n b{color:var(--cream)}
.rq.pending .warn{background:var(--red);color:var(--cream);border-radius:12px;padding:10px 12px;font-size:14px;margin:0}
/* how to pay */
.pay{position:relative;background:var(--ink);color:var(--cream);border-radius:24px;padding:22px 18px 18px;display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.pay .eyebrow{color:var(--muted-dark)}
.pay h2{color:var(--cream);font-size:clamp(48px,13vw,68px);line-height:.95}
.tier-tag{position:absolute;top:18px;right:18px;background:var(--red);color:var(--cream);font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:5px 10px;white-space:nowrap}
.pay-hint{color:var(--muted-dark);font-size:14px;margin:0 0 4px}
.prow-list{display:grid;gap:6px}
.prow{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"k p" "v p";column-gap:12px;row-gap:1px;align-items:center;background:var(--ink-2);border:1.5px solid transparent;border-radius:14px;padding:10px 12px 10px 14px;width:100%;-webkit-tap-highlight-color:transparent;transition:transform .12s,border-color .2s,background .2s}
.prow:active{transform:scale(.98)}
.prow:focus-visible{outline:3px solid #ff4a3d;outline-offset:2px}
.prow .pk{grid-area:k;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-dark)}
.prow .pv{grid-area:v;font-family:var(--f-mono);font-size:16px;font-weight:500;color:var(--cream);overflow-wrap:anywhere;line-height:1.3}
.prow .pill{grid-area:p;font-size:12px;font-weight:700;border:1.5px solid #4a423b;border-radius:999px;padding:5px 11px;color:var(--cream);white-space:nowrap}
.prow.key .pk{color:#ff8a7f}
.prow.got{border-color:var(--red);background:#2a1513}
.prow.got .pill{border-color:var(--red);background:var(--red);color:var(--cream)}
.prow.off{cursor:default;opacity:.6}
.pay-all{width:100%;margin-top:4px}
.pay-faq{background:var(--paper);border:1.5px solid var(--line);border-radius:20px;padding:18px}
.pay-faq h3{font-size:20px;margin-bottom:6px}
.pay-faq dl{margin:0;display:grid}
.pay-faq dl div{padding:10px 0;border-top:1px solid var(--line)}
.pay-faq dl div:first-child{border-top:0}
.pay-faq dt{font-weight:700;font-size:15px}
.pay-faq dd{margin:2px 0 0;color:var(--muted);font-size:14.5px;line-height:1.5}
.pay-faq b{font-family:var(--f-mono);color:var(--ink)}
@media (max-width:380px){.prow .pv{font-size:14.5px}}
/* request received */
.rq{position:relative;overflow:hidden;background:var(--ink);color:var(--cream);border-radius:24px;padding:28px 24px;display:grid;gap:12px;grid-template-columns:minmax(0,1fr);animation:rqIn .5s cubic-bezier(.2,.9,.3,1.2) both}
.rq h1{color:var(--cream);font-size:clamp(36px,9vw,58px)}
.rq .lead{color:var(--muted-dark)}
.rq .state{background:var(--red);border-color:var(--red);color:var(--cream)}
.wl-tag{justify-self:start;background:var(--red);color:var(--cream);font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;border-radius:8px;padding:6px 10px}
.rq-stamp{position:absolute;top:22px;right:18px;font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#ff4a3d;border:3px solid #ff4a3d;border-radius:10px;padding:4px 12px;transform:rotate(12deg);animation:stamp .45s .35s cubic-bezier(.2,1.6,.4,1) both}
.rq-steps{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;position:relative}
.rq-steps li{display:grid;justify-items:center;gap:6px;font-family:var(--f-mono);font-size:10px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted-dark);position:relative;min-width:0;text-align:center}
.rq-steps li::before{content:"";position:absolute;top:8px;left:-50%;width:100%;height:2px;background:#3a3330;z-index:0}
.rq-steps li:first-child::before{display:none}
.rq-steps li.done::before,.rq-steps li.now::before{background:var(--red)}
.rq-steps i{width:18px;height:18px;border-radius:50%;border:2px solid #4a423b;background:var(--ink);position:relative;z-index:1}
.rq-steps li.done i{background:var(--red);border-color:var(--red);animation:pop .4s both}
.rq-steps li.done:nth-child(2) i{animation-delay:.15s}
.rq-steps li.now i{border-color:#ff4a3d;animation:pulse 1.6s infinite}
.rq-steps li.done,.rq-steps li.now{color:var(--cream)}
.rq-steps.on-red li{color:#f3d3cc}
.rq-steps.on-red li.done,.rq-steps.on-red li.now{color:var(--cream)}
.rq-steps.on-red li::before{background:rgba(244,234,215,.3)}
.rq-steps.on-red li.done::before,.rq-steps.on-red li.now::before{background:var(--cream)}
.rq-steps.on-red i{background:var(--red);border-color:rgba(244,234,215,.45)}
.rq-steps.on-red li.done i{background:var(--cream);border-color:var(--cream)}
.rq-steps.on-red li.now i{border-color:var(--cream);animation:pulseC 1.6s infinite}
@keyframes pulseC{0%{box-shadow:0 0 0 0 rgba(244,234,215,.7)}70%{box-shadow:0 0 0 10px rgba(244,234,215,0)}100%{box-shadow:0 0 0 0 rgba(244,234,215,0)}}
@keyframes rqIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes stamp{from{opacity:0;transform:rotate(12deg) scale(2.2)}to{opacity:1;transform:rotate(12deg) scale(1)}}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,74,61,.6)}70%{box-shadow:0 0 0 10px rgba(255,74,61,0)}100%{box-shadow:0 0 0 0 rgba(255,74,61,0)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
@media (prefers-reduced-motion: reduce){.rq,.rq-stamp,.rq-steps i{animation:none!important}}
/* you're in */
.hype{background:var(--ink);color:var(--cream);border-radius:24px;padding:28px 24px;display:grid;gap:12px;position:relative;overflow:hidden}
.hype h1{color:var(--cream);font-size:clamp(38px,9vw,60px)}
.hype h1 em{font-style:normal;color:#ff4a3d}
.hype .lead{color:var(--muted-dark)}
.hype .count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.hype .count div{background:var(--ink-2);border-radius:14px;padding:10px 4px;min-width:0;text-align:center}
.hype .count b{display:block;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1;color:var(--cream);font-variant-numeric:tabular-nums}
.hype .count span{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-dark)}
.cine{position:relative;background:#111;color:#f5f5f0;border-radius:10px;padding:40px 24px 36px;display:grid;gap:16px;justify-items:center;text-align:center;box-shadow:10px 10px 0 var(--red)}
.cine .holes{position:absolute;left:14px;right:14px;height:12px;background:radial-gradient(circle,var(--cream) 4px,transparent 4.5px) 0 50%/20px 12px repeat-x}
.cine .holes.t{top:10px}.cine .holes.b{bottom:10px}
.cine .logo{width:150px}
.cine .ev{font-family:var(--f-display);font-size:32px;line-height:1.05;color:#f5f5f0}
.cine .meta{color:#a9a9a2;font-size:15px}
.cine .perf{position:relative;border-top:2px dashed #444;width:calc(100% + 48px);margin:4px -24px}
.cine .perf::before,.cine .perf::after{content:"";position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--cream)}
.cine .perf::before{left:-12px}.cine .perf::after{right:-12px}
.cine .code{font-family:var(--f-mono);font-size:24px;letter-spacing:.1em;color:#f5f5f0}
.cine .who{font-family:var(--f-mono);font-size:16px;color:#f5f5f0}
.cine .qr{background:#f5f5f0}
.where{background:var(--red);color:var(--cream);border-radius:20px;padding:20px 22px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.where p{font-size:20px;font-weight:700;margin-top:2px}
.where .btn{background:var(--cream);border-color:var(--cream);color:var(--red)}
.inbar{background:var(--ink);color:var(--cream);border:2px solid var(--red);border-radius:20px;padding:20px 22px;display:flex;align-items:center;gap:14px}
.inbar .tick{flex:none;width:52px;height:52px;border-radius:50%;background:var(--red);color:var(--cream);display:grid;place-items:center;font-size:30px;font-weight:700;line-height:1}
.inbar b{display:block;font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.05}
.inbar span{font-size:15px;opacity:.9}
.cine .instamp{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%) rotate(-12deg);border:5px solid #ff4a3d;color:#ff4a3d;background:rgba(17,17,17,.85);font-family:var(--f-mono);font-size:28px;font-weight:500;letter-spacing:.14em;padding:10px 18px;border-radius:12px;white-space:nowrap;z-index:2}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions .btn{width:100%}
.actions .btn.outline{color:var(--ink);border-color:var(--ink)}
@media (max-width:420px){.actions{grid-template-columns:1fr}}
/* payment fields */
.fbox{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--cream);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.fbox .k{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fbox .v{display:block;font-family:var(--f-mono);font-size:17px;font-weight:500;letter-spacing:.03em;color:var(--ink);overflow-wrap:anywhere;margin-top:2px}
.fbox > div{min-width:0}
.fbox.dark{background:var(--ink);border-color:var(--ink)}
.fbox.dark .k{color:var(--muted-dark)}
.fbox.dark .v{color:var(--cream)}
.fbox.dark .copy{color:var(--cream);border-color:#4a423b}
.fbox .copy{flex:none}
.howto{gap:22px}
.howto li > div{min-width:0}
.howto h3{margin-top:8px}
@media (max-width:520px){
  .card{padding:18px}
  .howto li{grid-template-columns:30px 1fr;gap:10px}
  .howto li::before{width:30px;height:30px;font-size:14px}
  .howto h3{margin-top:3px;font-size:18px}
  .fbox{padding:10px 12px}
  .fbox .v{font-size:15px;letter-spacing:.01em}
}
/* programme */
.prog{background:var(--ink);color:var(--cream);border-radius:22px;padding:22px 22px 14px}
.prog-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.prog-head h2{font-size:26px;color:var(--cream)}
.prog-head .live{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#ff4a3d;display:inline-flex;align-items:center;gap:7px}
.prog-head .live::before{content:"";width:8px;height:8px;border-radius:50%;background:#ff4a3d;animation:pp-pulse 1.4s ease-in-out infinite}
@keyframes pp-pulse{50%{opacity:.25}}
.prog ol{list-style:none;margin:0;padding:0}
.prog li{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:center;padding:12px 0;border-top:1px solid #2e2925}
.prog li:first-child{border-top:0}
.prog .tm{font-family:var(--f-mono);font-size:15px;color:var(--muted-dark);font-variant-numeric:tabular-nums}
.prog .tt{font-weight:700;font-size:17px;line-height:1.3}
.prog li.past{opacity:.4}
.prog li.now{background:var(--red);border-radius:12px;padding:12px;margin-inline:-12px;border-top-color:transparent}
.prog li.now + li{border-top-color:transparent}
.prog li.now .tm{color:#f3d3cc}
.prog .tag{display:inline-block;margin-left:8px;font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;background:var(--cream);color:var(--red);padding:3px 8px;border-radius:999px;vertical-align:2px}
/* after the party */
.thanks{background:var(--red);color:var(--cream);border-radius:24px;padding:28px 24px;display:grid;gap:12px}
.thanks h1{color:var(--cream);font-size:clamp(38px,9vw,58px)}
.thanks p{color:#f3d3cc;max-width:44ch}
.thanks .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.thanks .btn{width:100%;background:var(--cream);border-color:var(--cream);color:var(--red)}
.thanks .btn.ghost{background:transparent;color:var(--cream);border-color:rgba(244,234,215,.55)}
@media (max-width:420px){.thanks .btns{grid-template-columns:1fr}}
/* next party (one tap for returning guests) */
.nextc{background:var(--ink);color:var(--cream);border-radius:24px;padding:26px 24px;display:grid;gap:10px;justify-items:start}
.nextc .kick{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-dark)}
.nextc h2{font-size:clamp(30px,8vw,52px);color:var(--cream);justify-self:stretch}
.nextc .date{color:var(--muted-dark);font-size:17px;margin-top:-4px}
.nextc .badge{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;background:#ff4a3d;color:var(--ink);padding:5px 10px;border-radius:999px}
.nextc .btn{margin-top:6px}
.nextc .sub{font-size:14px;color:var(--muted-dark)}
.nextc .sub a{color:var(--cream)}
.nextc .err{color:#ff8a7f;font-size:14px;font-weight:700}
/* invite a friend */
.invite{background:var(--cream-2);border:2px dashed var(--ink);border-radius:22px;padding:22px;display:grid;gap:12px}
.invite .left{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--red-deep)}
.invite h2{font-size:30px}
.invite p{color:var(--muted);font-size:15px}
.invite .lnk{font-family:var(--f-mono);font-size:14px;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;overflow-wrap:anywhere}
.invite .row2{display:flex;gap:8px;flex-wrap:wrap}
.invite .dots{display:flex;gap:6px}.invite .dots i{flex:1;max-width:56px;height:8px;border-radius:99px;background:var(--paper);border:1.5px solid var(--ink)}.invite .dots i.on{background:var(--red)}
.invite .btn.outline{color:var(--ink);border-color:var(--ink)}
/* priority for returning guests */
.prio{display:flex;gap:14px;align-items:center;background:var(--ink);color:var(--cream);border-radius:18px;padding:16px 18px}
.prio .star{flex:none;width:46px;height:46px;border-radius:50%;background:#ff4a3d;color:var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-size:22px}
.prio b{display:block;font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.1}
.prio span{font-size:14px;color:var(--muted-dark)}
/* confirm it's you (Instagram DM) */
.verify{background:var(--ink);color:var(--cream);border-radius:22px;padding:24px 22px;display:grid;gap:12px;border:2px solid #ff4a3d}
.verify .kick{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#ff4a3d}
.verify h2{font-size:clamp(28px,6.5vw,38px);color:var(--cream)}
.verify p{color:var(--muted-dark);font-size:15px}
.verify p b{color:var(--cream)}
.vcode{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--cream);color:var(--ink);border-radius:14px;padding:12px 14px}
.vcode span{font-family:var(--f-mono);font-size:clamp(24px,7vw,32px);font-weight:500;letter-spacing:.08em}
.vcode .copy{border-color:var(--ink)}
.verify .warn{background:var(--red);color:var(--cream);border-radius:12px;padding:10px 12px;font-size:14px}
.verified{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#dcefdc;color:#1f7a3d;border-radius:14px;padding:10px 14px;font-size:14px;font-weight:700}
.verified code{font-family:var(--f-mono);font-weight:500;color:var(--ink);background:#fff;border-radius:8px;padding:2px 8px}
/* log in with Instagram + code */
.login{max-width:440px;display:grid;gap:14px}
.login label{display:grid;gap:6px}
.login .err{color:var(--red-deep);font-size:14px;font-weight:700;min-height:1.2em}
/* every card is a one-column grid that never grows wider than the screen */
.hero-ok,.amount,.hype,.cine,.thanks,.nextc,.invite,.verify,.card,.prog{grid-template-columns:minmax(0,1fr)}
/* small phones */
.vcode span{white-space:nowrap;min-width:0;font-size:clamp(20px,6.4vw,32px)}
.badge,.state{white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.fbox .v{overflow-wrap:break-word}
@media (max-width:400px){
  .tiers{grid-template-columns:1fr;gap:6px}
  .tier{display:grid;grid-template-columns:64px 1fr auto;grid-template-areas:"p n y" "p u y";align-items:center;column-gap:10px;padding:8px 12px}
  .tier b{grid-area:p;font-size:22px}
  .tier .tn{grid-area:n}
  .tier .tu{grid-area:u}
  .tier .you{display:none}
  .tier{grid-template-columns:64px 1fr}
  .fbox .v{font-size:14px;letter-spacing:0}
  .prog-head h2{font-size:22px}
  .cine .instamp{font-size:20px;padding:8px 12px;border-width:4px}
  .verify,.nextc,.thanks,.invite,.hype,.hero-ok{padding-inline:18px}
}
/* app + notifications */
.appc{display:flex;gap:14px;align-items:center;background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px}
.appc .ic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--ink) url(/icon-192.png) center/cover}
.appc .tx{flex:1;min-width:0;display:grid;gap:2px}
.appc .tx b{font-size:15px}
.appc .tx span{font-size:13px;color:var(--muted)}
.appc .btn{flex:none;padding:9px 16px;font-size:14px}
.appc.on{background:var(--cream-2);border-color:var(--ink)}
.appc.on .tx b{color:var(--red)}
.appc .steps{font-size:13px;color:var(--ink-2);margin:4px 0 0;padding-left:18px}
@media (max-width:420px){.appc{flex-wrap:wrap}.appc .btn{width:100%}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="mark" href="/">Perugia<span>Party</span></a>
    <nav aria-label="Main"><a href="/#rules">House rules</a><a class="keep" href="/#faq">FAQ</a><a class="btn" id="nav-cta" href="/#request">Request a place</a></nav>
  </div>
</header>
<main class="wrap">
  <div class="page" id="page"><p class="note">Loading your ticket…</p></div>
</main>

<script src="/vendor/qrcode.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const euro = n => n == null ? "—" : "€" + (Number(n) % 1 ? Number(n).toFixed(2).replace(".", ",") : Number(n));
const when = t => new Date(t).toLocaleString("en-GB", { weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit", timeZone:"Europe/Rome" });

const params = new URLSearchParams(location.search);
let token = params.get("t");
try { if (token) localStorage.setItem("pp_token", token); else token = localStorage.getItem("pp_token"); } catch(e){}
if (token) { const c = document.getElementById("nav-cta"); c.textContent = "My ticket"; c.href = "/ticket.html?t=" + encodeURIComponent(token); }

function payLeftHTML(dl){
  const ms = dl - Date.now();
  const when = new Date(dl).toLocaleString("en-GB", { weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit", timeZone:"Europe/Rome" });
  if (ms <= 0) return `⏱ Your time to pay is up. <span>Pay now or DM us</span>, otherwise your place can go to someone on the waitlist.`;
  const m = Math.floor(ms / 60000), dd = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60;
  const txt = dd >= 2 ? `${dd} days` : dd === 1 ? `1 day ${h} h` : h ? `${h} h ${mm} min` : `${mm} min`;
  return `⏱ Pay within <span>${txt}</span><br><small style="font-weight:500;opacity:.75">Before ${when}</small>`;
}
function payRow(k, shown, value, key){
  if (!value) return `<div class="prow off"><span class="pk">${k}</span><span class="pv">${esc(shown)}</span></div>`;
  return `<button class="prow${key ? " key" : ""}" type="button" data-copy="${esc(value)}"><span class="pk">${k}</span><span class="pv">${esc(shown)}</span><span class="pill">Copy</span></button>`;
}
function copyBtn(value){ return `<button class="copy" type="button" data-copy="${esc(value)}">Copy</button>`; }
document.addEventListener("click", e => {
  const b = e.target.closest("[data-copy]"); if (!b) return;
  const v = b.dataset.copy;
  const pill = b.querySelector(".pill");
  if (pill) { const done = () => { b.classList.add("got"); pill.textContent = "Copied"; note && note("Copied", "ok"); setTimeout(() => pill.textContent = "Copy", 1800); };
    try { navigator.clipboard.writeText(v).then(done, () => note("Long-press to copy", "warn")); } catch(x){ note("Long-press to copy", "warn"); } return; }
  const label = b.textContent; const done = () => { b.textContent = "Copied"; setTimeout(() => b.textContent = label, 1500); };
  const fail = () => { b.textContent = "Long-press to copy"; note("Long-press to copy", "warn"); };
  try { navigator.clipboard.writeText(v).then(done, fail); } catch(x){ fail(); }
});

function oops(title, text, retry){
  $("page").innerHTML = `<div class="oops"><p class="big" aria-hidden="true">:(</p><h1>${title}</h1><p>${text}</p>
    <div class="acts">${retry ? `<button class="btn" type="button" id="retry">Try again</button>` : ""}<a class="btn outline" href="https://ig.me/m/perugiaparty" target="_blank" rel="noopener">DM us</a></div></div>`;
  if (retry) $("retry").addEventListener("click", retry);
}
const note = (m, t, o) => window.ppNotify && ppNotify(m, t, o);
function empty(title, text){
  $("page").innerHTML = `<div class="empty"><h1 style="font-size:40px">${title}</h1><p class="lead">${text}</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><a class="btn" href="/#request">Request a place</a><a class="btn outline" href="https://ig.me/m/perugiaparty" target="_blank" rel="noopener">DM us</a></div></div>`;
}

function drawQR(text, canvas){
  const qr = qrcode(0, "M"); qr.addData(text); qr.make();
  const n = qr.getModuleCount(), cell = 10, q = 2;
  canvas.width = canvas.height = (n + q*2) * cell;
  const x = canvas.getContext("2d");
  x.fillStyle = "#f7f8ef"; x.fillRect(0, 0, canvas.width, canvas.height);
  x.fillStyle = "#141210";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) x.fillRect((c+q)*cell, (r+q)*cell, cell, cell);
}

function loadImage(src){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function ticketCanvas(d){
  try { await document.fonts.ready; } catch(e){}
  const W = 1080, H = 1700, c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  x.fillStyle = "#f4ead7"; x.fillRect(0, 0, W, H);
  x.fillStyle = "#111"; x.beginPath(); x.roundRect ? x.roundRect(40, 40, W-80, H-80, 28) : x.rect(40, 40, W-80, H-80); x.fill();
  x.fillStyle = "#f4ead7"; for (let px = 90; px < W-60; px += 40) { x.beginPath(); x.arc(px, 70, 8, 0, 7); x.fill(); x.beginPath(); x.arc(px, H-70, 8, 0, 7); x.fill(); }
  try { const logo = await loadImage("/logo.png"); const lw = 380, lh = lw * logo.height / logo.width; x.drawImage(logo, (W-lw)/2, 130, lw, lh); } catch(e){}
  x.textAlign = "center"; x.fillStyle = "#f5f5f0";
  x.font = `68px "Bowlby One", Impact, sans-serif`; x.fillText(d.event || "PerugiaParty", W/2, 510);
  x.fillStyle = "#a9a9a2"; x.font = `500 34px "Figtree", sans-serif`;
  x.fillText([d.date_label, d.doors && "doors " + d.doors].filter(Boolean).join(" · "), W/2, 570);
  x.strokeStyle = "#444"; x.setLineDash([14, 10]); x.lineWidth = 4; x.beginPath(); x.moveTo(40, 640); x.lineTo(W-40, 640); x.stroke(); x.setLineDash([]);
  x.fillStyle = "#f4ead7"; x.beginPath(); x.arc(40, 640, 26, 0, 7); x.fill(); x.beginPath(); x.arc(W-40, 640, 26, 0, 7); x.fill();
  const qc = document.createElement("canvas"); drawQR(d.qr, qc);
  const box = 560; x.fillStyle = "#f5f5f0"; x.fillRect((W-box)/2 - 24, 700, box + 48, box + 48);
  x.imageSmoothingEnabled = false; x.drawImage(qc, (W-box)/2, 724, box, box);
  x.fillStyle = "#f5f5f0"; x.font = `500 60px "DM Mono", monospace`; x.fillText(d.code, W/2, 1420);
  x.font = `500 40px "DM Mono", monospace`; x.fillText(d.name, W/2, 1490);
  x.fillStyle = "#a9a9a2"; x.font = `500 26px "DM Mono", monospace`; x.fillText(d.crew ? "CREW PASS · PHOTO ID AT THE DOOR" : "PERSONAL TICKET · PHOTO ID AT THE DOOR · 18+", W/2, 1560);
  return c;
}
// Instagram, Facebook and TikTok's built-in browsers silently block file downloads
const IN_APP = /Instagram|FBAN|FBAV|FB_IAB|TikTok|musical_ly|Line\//i.test(navigator.userAgent);
function showTicketImage(src, d){
  const o = document.createElement("div"); o.className = "tsave"; o.setAttribute("role", "dialog"); o.setAttribute("aria-label", "Save your ticket");
  o.innerHTML = `<div class="tsave-in"><p class="tsave-h">Hold the ticket, then tap <b>Save image</b>.</p>
    <img src="${src}" alt="Your PerugiaParty ticket ${esc(d.code)}">
    <p class="tsave-n">${IN_APP ? "Want the PDF? Open this page in Safari or Chrome (⋯ → Open in browser)." : "Saved to your photos, it works without signal at the door."}</p>
    <button class="btn" type="button">Done</button></div>`;
  o.querySelector("button").addEventListener("click", () => o.remove());
  o.addEventListener("click", e => { if (e.target === o) o.remove(); });
  document.body.appendChild(o);
}
async function downloadTicket(d, btn){
  const label = btn.textContent; btn.disabled = true; btn.textContent = "Making your ticket…";
  const name = `PerugiaParty-${d.code}`;
  let img = null;
  try {
    const c = await ticketCanvas(d);
    img = c.toDataURL("image/jpeg", 0.92);
    if (IN_APP) { showTicketImage(img, d); }
    else {
      if (!window.jspdf) await new Promise(res => { const sc = document.createElement("script"); sc.src = "/vendor/jspdf.umd.min.js"; sc.onload = res; sc.onerror = res; document.head.appendChild(sc); });
      const { jsPDF } = window.jspdf || {};
      if (!jsPDF) throw new Error("no pdf");
      const pdf = new jsPDF({ unit: "mm", format: [108, 170], orientation: "portrait", compress: true });
      pdf.setProperties({ title: `${d.event} · ${d.code}`, subject: "PerugiaParty ticket" });
      pdf.addImage(img, "JPEG", 0, 0, 108, 170);
      pdf.save(name + ".pdf");
      btn.textContent = "Saved";
    }
  } catch (e) {
    if (img) showTicketImage(img, d); else note("Screenshot your QR", "error");
  }
  setTimeout(() => { btn.disabled = false; btn.textContent = label; }, 2000);
}
async function shareParty(d, btn){
  const text = `I'm going to ${d.event}${d.date_label ? " on " + d.date_label : ""} 🎉 Request your place before the list closes:`;
  const url = location.origin + "/";
  try { if (navigator.share) { await navigator.share({ title: "PerugiaParty", text, url }); return; } } catch (e) { if (e && e.name === "AbortError") return; }
  const label = btn.textContent;
  try { await navigator.clipboard.writeText(text + " " + url); btn.textContent = "Invite copied"; } catch (e) { btn.textContent = "Share perugiaparty.com"; }
  setTimeout(() => btn.textContent = label, 2500);
}
function addToCalendar(d){
  const start = new Date(d.starts_at), end = new Date(start.getTime() + 5 * 36e5);
  const f = t => t.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const esc2 = v => String(v || "").replace(/([,;\\])/g, "\\$1");
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//PerugiaParty//EN","BEGIN:VEVENT",
    "UID:" + d.code + "@perugiaparty.com","DTSTAMP:" + f(new Date()),"DTSTART:" + f(start),"DTEND:" + f(end),
    "SUMMARY:" + esc2(d.event + " · PerugiaParty"),"LOCATION:" + esc2(d.location),
    "DESCRIPTION:" + esc2("Your ticket: " + (d.link || location.href) + " · Bring photo ID."),"END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" })); a.download = "PerugiaParty.ics";
  document.body.appendChild(a); a.click(); a.remove();
}
let countTimer = null;
function startCount(iso){
  const el = $("tcount"); if (!el || !iso) return;
  const t = new Date(iso).getTime(); if (!Number.isFinite(t)) return;
  const tick = () => {
    const ms = t - Date.now();
    if (ms <= 0) { el.hidden = ms < -12 * 36e5; el.innerHTML = `<div style="min-width:auto"><b style="font-size:22px">It's party time.</b></div>`; clearInterval(countTimer); return; }
    const p = n => String(n).padStart(2, "0");
    el.innerHTML = [[Math.floor(ms/864e5),"days"],[p(Math.floor(ms/36e5)%24),"hours"],[p(Math.floor(ms/6e4)%60),"min"],[p(Math.floor(ms/1e3)%60),"sec"]].map(([v,l]) => `<div><b>${v}</b><span>${l}</span></div>`).join("");
    el.hidden = false;
  };
  clearInterval(countTimer); tick(); countTimer = setInterval(tick, 1000);
}

const DM = "https://ig.me/m/perugiaparty";
function romeMinutes(iso){
  const p = new Intl.DateTimeFormat("en-GB", { timeZone:"Europe/Rome", hour:"2-digit", minute:"2-digit", hourCycle:"h23" }).formatToParts(new Date(iso));
  return Number(p.find(x => x.type === "hour").value) * 60 + Number(p.find(x => x.type === "minute").value);
}
// programme times are local clock times; anything well before the start belongs to the next morning
function progItems(d){
  const list = d.program || [], s = new Date(d.starts_at).getTime();
  if (!list.length) return [];
  const sm = Number.isFinite(s) ? romeMinutes(d.starts_at) : null;
  return list.map(it => {
    const m = /^(\d\d):(\d\d)$/.exec(it.time || ""); let at = null;
    if (m && sm != null) { let delta = Number(m[1]) * 60 + Number(m[2]) - sm; if (delta < -360) delta += 1440; at = s + delta * 6e4; }
    return { ...it, at };
  });
}
function programmeHTML(d){
  const items = progItems(d); if (!items.length) return "";
  const timed = items.filter(i => i.at != null), now = Date.now();
  const live = timed.length && now >= timed[0].at - 36e5 && now <= timed[timed.length - 1].at + 3 * 36e5;
  let cur = -1; if (live) items.forEach((it, i) => { if (it.at != null && it.at <= now) cur = i; });
  return `<section class="prog" id="prog" aria-label="Programme"><div class="prog-head"><h2>${live ? "Tonight" : "The programme"}</h2>${live ? `<span class="live">Live</span>` : ""}</div>
    <ol>${items.map((it, i) => `<li class="${i === cur ? "now" : (cur > i ? "past" : "")}"><span class="tm">${esc(it.time || "·")}</span><span class="tt">${esc(it.title)}${i === cur ? `<span class="tag">Now</span>` : ""}</span></li>`).join("")}</ol></section>`;
}
function partyOver(d){ const s = new Date(d.starts_at).getTime(); return Number.isFinite(s) && Date.now() > s + 8 * 36e5; }
function thanksHTML(d, first){
  return `<div class="thanks"><span class="state">That's a wrap</span>
    <h1>Thanks for coming, ${first}.</h1>
    <p>Got photos or videos from the night? Send them our way, the best ones end up on our page. And tell us how it was: we read every message.</p>
    <div class="btns"><a class="btn" href="${DM}" target="_blank" rel="noopener">Send your photos ↗</a><a class="btn ghost" href="${DM}" target="_blank" rel="noopener">Tell us how it was ↗</a></div></div>`;
}
function nextHTML(d){
  const n = d.next; if (!n) return "";
  let action;
  if (n.token) action = `<a class="btn" href="/ticket.html?t=${encodeURIComponent(n.token)}">Open my request →</a><p class="sub">You already requested a place for this one.</p>`;

          ${bankCountry && ibanCC !== "IT" ? `<div><dt>Foreign account?</dt><dd>Our account is in ${esc(CC[ibanCC] || ibanCC)}. It's a normal SEPA transfer in euro, so within the EU it works and costs the same as a transfer at home. If your bank asks for the country, choose ${esc(CC[ibanCC] || ibanCC)}.</dd></div>` : ""}
          <div><dt>Forgot the description?</dt><dd>Pay anyway. We match it by your name and amount.</dd></div>
          <div><dt>Lost this page?</dt><dd>Log in at perugiaparty.com/ticket with your Instagram and the code <b>${esc(d.vcode || d.code)}</b>.</dd></div>
        </dl>
      </div>
      <p class="note">Something else? DM <a href="https://ig.me/m/perugiaparty" target="_blank" rel="noopener">@perugiaparty</a>.</p>`;
    celebrate({ vcode: "ok-" + (d.code || "") }, 45);
    clearInterval(window.__payTimer);
    window.__payTimer = setInterval(() => { const el = document.getElementById("pay-left"); if (!el) return clearInterval(window.__payTimer); el.innerHTML = payLeftHTML(Number(el.dataset.dl)); }, 30000);
  } else if (d.status === "paid" || d.status === "in") {
    const inside = d.status === "in", over = partyOver(d);
    P.innerHTML = `${inside && over ? thanksHTML(d, first) : `<div class="hype ${inside ? "" : "paid"}">
        ${inside ? "" : `<span class="rq-stamp paid-stamp" aria-hidden="true">${d.crew ? "Crew" : "Paid"}</span>`}
        ${inside ? `<span class="state">Checked in</span>` : ""}
        <h1>${inside ? `You made it, <em>${first}</em>.` : d.crew ? `You're crew, ${first}.` : `You're going, ${first}.`}</h1>
        <p class="lead">${inside ? "Enjoy the night." : d.crew ? `Thanks for making <b>${esc(d.event)}</b> happen. Nothing to pay: your crew pass and the place are below.` : `See you at <b>${esc(d.event)}</b>${d.date_label ? ", " + esc(d.date_label) : ""}. Your ticket and the place are unlocked below.`}</p>
        <div class="count" id="tcount" ${inside ? 'style="display:none"' : ""} hidden></div>
        ${d.crew ? "" : stepsHTML(inside ? 5 : 4, inside ? "" : "on-red")}
      </div>
      ${inside ? `<div class="inbar" role="status"><div><b>Checked in</b><span>${d.in_at ? "Entered at " + new Date(d.in_at).toLocaleTimeString("it-IT", { hour:"2-digit", minute:"2-digit", timeZone:"Europe/Rome" }) + ". " : ""}This ticket has been used.</span></div></div>` : ""}`}
      ${inside && !over ? programmeHTML(d) : ""}
      <div class="cine${inside ? "" : " shine"}${d.crew ? " crew" : ""}">${d.crew ? `<span class="crewband">Crew pass</span>` : ""}
        <span class="holes t" aria-hidden="true"></span><span class="holes b" aria-hidden="true"></span>
        ${inside ? `<span class="instamp">CHECKED IN</span>` : ""}
        <img class="logo" src="/logo.png" alt="PerugiaParty" width="150" height="106" decoding="async">
        <div><p class="ev">${esc(d.event)}</p><p class="meta">${esc([d.date_label, d.doors && "doors " + d.doors].filter(Boolean).join(" · "))}</p></div>
        <div class="perf" aria-hidden="true"></div>
        <div class="qr"><canvas id="qr" aria-label="Your entry QR code"></canvas></div>
        <p class="code">${esc(d.code)}</p>
        <p class="who">${esc(d.name)}</p>
        <p class="meta">Show this QR and your photo ID at the door</p>
      </div>
      ${d.location && !over ? `<div class="where"><div><span class="eyebrow unl">Unlocked · the place</span><p><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d.location)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline;text-underline-offset:3px">${esc(d.location)}</a></p></div><a class="btn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d.location)}" target="_blank" rel="noopener">Open in Google Maps</a></div>` : ""}
      ${!inside && !over ? programmeHTML(d) : ""}
      ${over ? "" : `<div class="actions">
        <button class="btn wide" type="button" id="pdf">${IN_APP ? "Save ticket" : "Save ticket (PDF)"}</button>
        ${d.starts_at ? `<button class="btn outline" type="button" id="cal">Calendar</button>` : ""}
        <button class="btn outline" type="button" id="share">Tell friends</button>
      </div>
      <p class="note">One entry, checked at the door with your photo ID. Save the PDF in case there's no signal.</p>`}`;
    if (!inside && !over) unlocked(d, first);
    try { drawQR(d.qr, $("qr")); } catch (e) { $("qr").parentElement.innerHTML = `<p style="color:#111;padding:20px;font-family:var(--f-mono)">${esc(d.code)}</p>`; }
    if ($("pdf")) $("pdf").addEventListener("click", e => downloadTicket(d, e.currentTarget));
    if ($("share")) $("share").addEventListener("click", e => shareParty(d, e.currentTarget));
    if ($("cal")) $("cal").addEventListener("click", () => addToCalendar(d));
    startCount(d.starts_at);
  } else if (d.status === "declined") {
    empty("Not this time.", "We couldn't give you a place for this edition. Keep an eye on Instagram for the next one.");
  } else if (d.status === "removed") {
    empty("Your place was cancelled.", "Your request or ticket for this party has been cancelled. DM us on Instagram if you have questions.");
  } else if (d.status === "released") {
    empty("Your place was released.", "Your place went back to the list. DM us on Instagram if you think this is a mistake.");
  } else {
    empty("Something's off.", "We couldn't read this ticket. DM us on Instagram and we'll sort it out.");
  }
  LAST = d;
  decorate(d);
  renderApp(d);
  fitHeadings();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitHeadings);
}

if (!token) {
  loginView();
} else {
  // live updates: check every 20 s while the page is open, and when the guest comes back to it
  let last = null, busy = false, prevVerified = null;
  const STATUS_TEXT = { waitlist: ["You're on the waitlist", "warn"], approved: ["You're accepted", "ok"], paid: ["Payment received", "ok"], in: ["You're checked in", "ok"], declined: ["Your request was updated", "warn"], released: ["Your request was updated", "warn"], removed: ["Your request was updated", "warn"] };
  async function check(first){
    if (busy) return; busy = true;
    try {
      const r = await fetch("/api/ticket?t=" + encodeURIComponent(token), { cache: "no-store" });
      const d = await r.json();
      if (!r.ok) { if (first) { try { localStorage.removeItem("pp_token"); } catch(e){} loginView("We couldn't find that ticket link. Log in with your Instagram and code instead."); } return; }
      const sig = JSON.stringify(d);
      if (sig === last) return;
      const prev = last ? JSON.parse(last).status : null;
      last = sig;
      render(d);
      if (prev && prev === d.status && d.verified && prevVerified === false) note("Instagram confirmed", "ok");
      prevVerified = !!d.verified;
      if (prev && prev !== d.status) { const [m, t] = STATUS_TEXT[d.status] || ["Your page just updated", "ok"]; note(m, t); window.scrollTo({ top: 0, behavior: "smooth" }); }
    } catch (e) {
      if (first) oops("Couldn't load your ticket.", navigator.onLine === false ? "You're offline. Connect to the internet and try again." : "We couldn't reach the server. Check your connection and try again.", () => { $("page").innerHTML = `<p class="note">Loading your ticket…</p>`; check(true); });
    } finally { busy = false; }
  }
  check(true);
  keepPushOnThisTicket();
  setInterval(() => { if (document.visibilityState === "visible") check(false); }, 20000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") check(false); });
}
</script>
</body>
</html>
