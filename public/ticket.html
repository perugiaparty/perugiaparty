<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My ticket · PerugiaParty</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#141210">
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Figtree:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/site.css">
<style>
main{padding-block:44px 80px}
.page{max-width:620px;margin-inline:auto;display:grid;gap:20px}
.state{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;border-radius:999px;padding:5px 12px;background:var(--cream-2);border:1.5px solid var(--ink)}
.state.ok{background:var(--red);border-color:var(--red);color:var(--cream)}
h1{font-size:clamp(40px,8vw,64px)}
.lead{font-size:18px;color:var(--muted);max-width:46ch}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:20px;padding:22px;display:grid;gap:14px}
.row{display:grid;grid-template-columns:130px 1fr auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px}
.row:last-child{border-bottom:0;padding-bottom:0}
.row dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.row dd{margin:0;font-weight:700;overflow-wrap:anywhere;min-width:0}
.row dd.mono{font-family:var(--f-mono);font-weight:500;letter-spacing:.04em}
.copy{font:inherit;font-size:13px;font-weight:700;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;cursor:pointer}
.copy:hover{border-color:var(--ink)}
@media (max-width:520px){.row{grid-template-columns:1fr auto}.row dt{grid-column:1/-1}}
.deadline{background:var(--ink);color:var(--cream);border-radius:16px;padding:16px 18px;font-weight:700}
.deadline span{color:#ff8a7f}
.ticket{background:var(--ink);color:var(--cream);border-radius:24px;padding:26px;display:grid;gap:18px;justify-items:center;text-align:center;box-shadow:12px 12px 0 var(--red)}
.ticket .logo{width:170px}
.ticket .ev{font-family:var(--f-display);font-size:30px;line-height:1.05}
.ticket .meta{color:var(--muted-dark);font-size:15px}
.qr{background:var(--cream);padding:14px;border-radius:16px;width:min(260px,70vw)}
.qr canvas{width:100%;height:auto;display:block;image-rendering:pixelated}
.ticket .code{font-family:var(--f-mono);font-size:26px;letter-spacing:.1em}
.ticket .who{font-weight:700;font-size:18px}
.loc{background:var(--red);color:var(--cream);border-radius:20px;padding:20px 22px;display:grid;gap:6px}
.loc p{font-size:20px;font-weight:700}
.loc a{color:var(--cream)}
.note{font-size:14px;color:var(--muted)}
.empty{text-align:center;padding:40px 10px;display:grid;gap:14px;justify-items:center}
/* accepted landing */
.hero-ok{background:var(--red);color:var(--cream);border-radius:24px;padding:28px;display:grid;gap:10px}
.hero-ok h1{color:var(--cream)}
.hero-ok .state{justify-self:start}
.hero-ok .lead{color:#f3d3cc}
.amount{background:var(--ink);color:var(--cream);border-radius:22px;padding:24px;display:grid;gap:6px}
.amount .big{font-family:var(--f-display);font-size:clamp(48px,11vw,72px);line-height:1;color:var(--cream)}
.amount .why{color:var(--muted-dark);font-size:15px;max-width:46ch}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tier{border:1.5px solid #3a3330;border-radius:14px;padding:10px 12px;color:var(--muted-dark);font-size:14px}
.tier b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px;color:var(--muted-dark)}
.tier.me{border-color:var(--cream);background:var(--ink-2);color:var(--cream)}
.tier.me b{color:var(--cream)}
.tier .you{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#ff8a7f}
.howto{list-style:none;margin:0;padding:0;counter-reset:h;display:grid;gap:16px}
.howto li{counter-increment:h;display:grid;grid-template-columns:40px 1fr;gap:14px;align-items:start}
.howto li::before{content:counter(h);display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--red);color:var(--cream);font-family:var(--f-display);font-size:18px}
.howto h3{font-size:20px;margin-bottom:4px}
.howto p{color:var(--muted);font-size:15px}
.ref{font-family:var(--f-mono);font-size:18px;background:var(--ink);color:var(--cream);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;overflow-wrap:anywhere}
.ref .copy{color:var(--cream);border-color:#4a423b}
.copyall{justify-self:start}
.state{justify-self:start}
/* you're in */
.hype{background:var(--ink);color:var(--cream);border-radius:24px;padding:28px 24px;display:grid;gap:12px;position:relative;overflow:hidden}
.hype h1{color:var(--cream);font-size:clamp(38px,9vw,60px)}
.hype h1 em{font-style:normal;color:#ff4a3d}
.hype .lead{color:var(--muted-dark)}
.hype .count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.hype .count div{background:var(--ink-2);border-radius:14px;padding:10px 4px;min-width:0;text-align:center}
.hype .count b{display:block;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1;color:var(--cream);font-variant-numeric:tabular-nums}
.hype .count span{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-dark)}
.cine{position:relative;background:#111;color:#f5f5f0;border-radius:10px;padding:40px 24px 36px;display:grid;gap:16px;justify-items:center;text-align:center;box-shadow:10px 10px 0 var(--red)}
.cine .holes{position:absolute;left:14px;right:14px;height:12px;background:radial-gradient(circle,var(--cream) 4px,transparent 4.5px) 0 50%/20px 12px repeat-x}
.cine .holes.t{top:10px}.cine .holes.b{bottom:10px}
.cine .logo{width:150px}
.cine .ev{font-family:var(--f-display);font-size:32px;line-height:1.05;color:#f5f5f0}
.cine .meta{color:#a9a9a2;font-size:15px}
.cine .perf{position:relative;border-top:2px dashed #444;width:calc(100% + 48px);margin:4px -24px}
.cine .perf::before,.cine .perf::after{content:"";position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--cream)}
.cine .perf::before{left:-12px}.cine .perf::after{right:-12px}
.cine .code{font-family:var(--f-mono);font-size:24px;letter-spacing:.1em;color:#f5f5f0}
.cine .who{font-family:var(--f-mono);font-size:16px;color:#f5f5f0}
.cine .qr{background:#f5f5f0}
.where{background:var(--red);color:var(--cream);border-radius:20px;padding:20px 22px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.where p{font-size:20px;font-weight:700;margin-top:2px}
.where .btn{background:var(--cream);border-color:var(--cream);color:var(--red)}
.inbar{background:#1f7a3d;color:#fff;border-radius:20px;padding:20px 22px;display:flex;align-items:center;gap:14px}
.inbar .tick{flex:none;width:52px;height:52px;border-radius:50%;background:#fff;color:#1f7a3d;display:grid;place-items:center;font-size:30px;font-weight:700;line-height:1}
.inbar b{display:block;font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.05}
.inbar span{font-size:15px;opacity:.9}
.cine .instamp{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%) rotate(-12deg);border:5px solid #3ddc84;color:#3ddc84;background:rgba(17,17,17,.85);font-family:var(--f-mono);font-size:28px;font-weight:500;letter-spacing:.14em;padding:10px 18px;border-radius:12px;white-space:nowrap;z-index:2}
.state.in{background:#1f7a3d;border-color:#1f7a3d;color:#fff}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions .btn{width:100%}
.actions .btn.outline{color:var(--ink);border-color:var(--ink)}
@media (max-width:420px){.actions{grid-template-columns:1fr}}
#live-note{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--cream);font-weight:700;font-size:15px;padding:12px 18px;border-radius:999px;box-shadow:6px 6px 0 var(--red);z-index:50;max-width:calc(100% - 32px);text-align:center;transition:opacity .3s,transform .3s}
#live-note.show{opacity:1;transform:translate(-50%,0)}
/* payment fields */
.fbox{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--cream);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.fbox .k{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fbox .v{display:block;font-family:var(--f-mono);font-size:17px;font-weight:500;letter-spacing:.03em;color:var(--ink);overflow-wrap:anywhere;margin-top:2px}
.fbox > div{min-width:0}
.fbox.dark{background:var(--ink);border-color:var(--ink)}
.fbox.dark .k{color:var(--muted-dark)}
.fbox.dark .v{color:var(--cream)}
.fbox.dark .copy{color:var(--cream);border-color:#4a423b}
.fbox .copy{flex:none}
.howto{gap:22px}
.howto li > div{min-width:0}
.howto h3{margin-top:8px}
@media (max-width:520px){
  .card{padding:18px}
  .howto li{grid-template-columns:30px 1fr;gap:10px}
  .howto li::before{width:30px;height:30px;font-size:14px}
  .howto h3{margin-top:3px;font-size:18px}
  .fbox{padding:10px 12px}
  .fbox .v{font-size:15px;letter-spacing:.01em}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="mark" href="/">Perugia<span>Party</span></a>
    <nav aria-label="Main"><a href="/#faq">FAQ</a><a class="btn" href="https://ig.me/m/perugiaparty" target="_blank" rel="noopener">DM us</a></nav>
  </div>
</header>
<main class="wrap">
  <div class="page" id="page"><p class="note">Loading your ticket…</p></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const euro = n => n == null ? "—" : "€" + (Number(n) % 1 ? Number(n).toFixed(2).replace(".", ",") : Number(n));
const when = t => new Date(t).toLocaleString("en-GB", { weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit", timeZone:"Europe/Rome" });

const params = new URLSearchParams(location.search);
let token = params.get("t");
try { if (token) localStorage.setItem("pp_token", token); else token = localStorage.getItem("pp_token"); } catch(e){}

function copyBtn(value){ return `<button class="copy" type="button" data-copy="${esc(value)}">Copy</button>`; }
document.addEventListener("click", e => {
  const b = e.target.closest("[data-copy]"); if (!b) return;
  const v = b.dataset.copy;
  const label = b.textContent; const done = () => { b.textContent = "Copied"; setTimeout(() => b.textContent = label, 1500); };
  try { navigator.clipboard.writeText(v).then(done, () => { b.textContent = "Long-press to copy"; }); } catch(x){ b.textContent = "Long-press to copy"; }
});

function empty(title, text){
  $("page").innerHTML = `<div class="empty"><h1 style="font-size:40px">${title}</h1><p class="lead">${text}</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><a class="btn" href="/#request">Request a place</a><a class="btn outline" href="https://ig.me/m/perugiaparty" target="_blank" rel="noopener">DM us</a></div></div>`;
}

function drawQR(text, canvas){
  const qr = qrcode(0, "M"); qr.addData(text); qr.make();
  const n = qr.getModuleCount(), cell = 10, q = 2;
  canvas.width = canvas.height = (n + q*2) * cell;
  const x = canvas.getContext("2d");
  x.fillStyle = "#f7f8ef"; x.fillRect(0, 0, canvas.width, canvas.height);
  x.fillStyle = "#141210";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) x.fillRect((c+q)*cell, (r+q)*cell, cell, cell);
}

function loadImage(src){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function ticketCanvas(d){
  try { await document.fonts.ready; } catch(e){}
  const W = 1080, H = 1700, c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  x.fillStyle = "#f4ead7"; x.fillRect(0, 0, W, H);
  x.fillStyle = "#111"; x.beginPath(); x.roundRect ? x.roundRect(40, 40, W-80, H-80, 28) : x.rect(40, 40, W-80, H-80); x.fill();
  x.fillStyle = "#f4ead7"; for (let px = 90; px < W-60; px += 40) { x.beginPath(); x.arc(px, 70, 8, 0, 7); x.fill(); x.beginPath(); x.arc(px, H-70, 8, 0, 7); x.fill(); }
  try { const logo = await loadImage("/logo.png"); const lw = 380, lh = lw * logo.height / logo.width; x.drawImage(logo, (W-lw)/2, 130, lw, lh); } catch(e){}
  x.textAlign = "center"; x.fillStyle = "#f5f5f0";
  x.font = `68px "Bowlby One", Impact, sans-serif`; x.fillText(d.event || "PerugiaParty", W/2, 510);
  x.fillStyle = "#a9a9a2"; x.font = `500 34px "Figtree", sans-serif`;
  x.fillText([d.date_label, d.doors && "doors " + d.doors].filter(Boolean).join(" · "), W/2, 570);
  x.strokeStyle = "#444"; x.setLineDash([14, 10]); x.lineWidth = 4; x.beginPath(); x.moveTo(40, 640); x.lineTo(W-40, 640); x.stroke(); x.setLineDash([]);
  x.fillStyle = "#f4ead7"; x.beginPath(); x.arc(40, 640, 26, 0, 7); x.fill(); x.beginPath(); x.arc(W-40, 640, 26, 0, 7); x.fill();
  const qc = document.createElement("canvas"); drawQR(d.qr, qc);
  const box = 560; x.fillStyle = "#f5f5f0"; x.fillRect((W-box)/2 - 24, 700, box + 48, box + 48);
  x.imageSmoothingEnabled = false; x.drawImage(qc, (W-box)/2, 724, box, box);
  x.fillStyle = "#f5f5f0"; x.font = `500 60px "DM Mono", monospace`; x.fillText(d.code, W/2, 1420);
  x.font = `500 40px "DM Mono", monospace`; x.fillText(d.name, W/2, 1490);
  x.fillStyle = "#a9a9a2"; x.font = `500 26px "DM Mono", monospace`; x.fillText("PERSONAL TICKET · PHOTO ID AT THE DOOR · 18+", W/2, 1560);
  return c;
}
async function downloadTicket(d, btn){
  const label = btn.textContent; btn.disabled = true; btn.textContent = "Making your PDF…";
  try {
    const c = await ticketCanvas(d);
    const img = c.toDataURL("image/jpeg", 0.92);
    const { jsPDF } = window.jspdf || {};
    const name = `PerugiaParty-${d.code}`;
    if (jsPDF) {
      const pdf = new jsPDF({ unit: "mm", format: [108, 170], orientation: "portrait", compress: true });
      pdf.setProperties({ title: `${d.event} · ${d.code}`, subject: "PerugiaParty ticket" });
      pdf.addImage(img, "JPEG", 0, 0, 108, 170);
      pdf.save(name + ".pdf");
    } else {
      const a = document.createElement("a"); a.download = name + ".png"; a.href = img; document.body.appendChild(a); a.click(); a.remove();
    }
    btn.textContent = "Saved ✓";
  } catch (e) { btn.textContent = "Couldn't make the PDF. Try again"; }
  setTimeout(() => { btn.disabled = false; btn.textContent = label; }, 2500);
}
async function shareParty(d, btn){
  const text = `I'm going to ${d.event}${d.date_label ? " on " + d.date_label : ""} 🎉 Request your place before the list closes:`;
  const url = location.origin + "/";
  try { if (navigator.share) { await navigator.share({ title: "PerugiaParty", text, url }); return; } } catch (e) { if (e && e.name === "AbortError") return; }
  const label = btn.textContent;
  try { await navigator.clipboard.writeText(text + " " + url); btn.textContent = "Invite copied ✓"; } catch (e) { btn.textContent = "Share perugiaparty.com"; }
  setTimeout(() => btn.textContent = label, 2500);
}
function addToCalendar(d){
  const start = new Date(d.starts_at), end = new Date(start.getTime() + 5 * 36e5);
  const f = t => t.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const esc2 = v => String(v || "").replace(/([,;\\])/g, "\\$1");
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//PerugiaParty//EN","BEGIN:VEVENT",
    "UID:" + d.code + "@perugiaparty.com","DTSTAMP:" + f(new Date()),"DTSTART:" + f(start),"DTEND:" + f(end),
    "SUMMARY:" + esc2(d.event + " · PerugiaParty"),"LOCATION:" + esc2(d.location),
    "DESCRIPTION:" + esc2("Your ticket: " + location.href + " · Bring photo ID."),"END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" })); a.download = "PerugiaParty.ics";
  document.body.appendChild(a); a.click(); a.remove();
}
let countTimer = null;
function startCount(iso){
  const el = $("tcount"); if (!el || !iso) return;
  const t = new Date(iso).getTime(); if (!Number.isFinite(t)) return;
  const tick = () => {
    const ms = t - Date.now();
    if (ms <= 0) { el.hidden = ms < -12 * 36e5; el.innerHTML = `<div style="min-width:auto"><b style="font-size:22px">It's party time.</b></div>`; clearInterval(countTimer); return; }
    const p = n => String(n).padStart(2, "0");
    el.innerHTML = [[Math.floor(ms/864e5),"days"],[p(Math.floor(ms/36e5)%24),"hours"],[p(Math.floor(ms/6e4)%60),"min"],[p(Math.floor(ms/1e3)%60),"sec"]].map(([v,l]) => `<div><b>${v}</b><span>${l}</span></div>`).join("");
    el.hidden = false;
  };
  clearInterval(countTimer); tick(); countTimer = setInterval(tick, 1000);
}

function render(d){
  const P = $("page"), first = esc(String(d.name || "").split(" ")[0]);
  if (d.status === "requested") {
    P.innerHTML = `<span class="state">Request received</span><h1>Thanks, ${first}.</h1>
      <p class="lead">We're checking your request for <b>${esc(d.event)}</b>. Come back to this page: once you're approved, your price and personal code appear here.</p>
      <div class="card"><p><b>Save this link.</b> It's your personal page and only works for you.</p><p class="mono" style="font-family:var(--f-mono);overflow-wrap:anywhere">${esc(location.href)}</p><div>${copyBtn(location.href)}</div></div>`;
  } else if (d.status === "approved") {
    const left = d.deadline ? d.deadline - Date.now() : null;
    const overdue = left != null && left < 0;
    const names = { early: "Early bird", normal: "Normal", late: "Late" };
    const tierName = names[d.ticket] || "Ticket";
    const day = iso => iso ? new Date(iso).toLocaleDateString("en-GB", { weekday:"short", day:"numeric", month:"short", timeZone:"Europe/Rome" }) : null;
    const eu = d.tiers && day(d.tiers.early_until), nu = d.tiers && day(d.tiers.normal_until);
    const why = {
      early: eu ? `You were approved before ${eu}, so you get the early bird price. Prices go up as the party gets closer.` : "You were approved early, so you get the lowest price. Prices go up as the party gets closer.",
      normal: nu ? `You were approved ${eu ? "after the early bird period" : "at the normal price"}${nu ? ", before " + nu : ""}, so the normal price applies.` : "You were approved at the normal price. The early bird places are gone, and late tickets cost more.",
      late: nu ? `You were approved after ${nu}, close to the party, so the late price applies.` : "You were approved close to the party, so the late price applies.",
    }[d.ticket] || "This is the price for your place.";
    const until = { early: eu ? "until " + eu : "", normal: nu ? "until " + nu : "", late: nu ? "after " + nu : "" };
    const tiers = d.tiers ? ["early","normal","late"].filter(t => d.tiers[t] != null && d.tiers[t] !== "") : [];
    const allText = `Amount: ${euro(d.price)}\nIBAN: ${d.iban || ""}\nBeneficiary: ${d.beneficiary || ""}\nReference: ${d.reference}`;
    P.innerHTML = `<div class="hero-ok"><span class="state" style="background:var(--cream);border-color:var(--cream);color:var(--red)">Accepted</span>
        <h1>You're in, ${first}.</h1>
        <p class="lead">You've been accepted for <b style="color:var(--cream)">${esc(d.event)}</b>${d.date_label ? " on " + esc(d.date_label) : ""}. Pay to confirm your place. After that, your ticket and the location unlock right here.</p></div>
      <div class="amount"><p class="eyebrow" style="color:var(--muted-dark)">You pay · ${esc(tierName)}</p>
        <p class="big">${euro(d.price)}</p>
        <p class="why">${esc(why)}</p>
        ${tiers.length > 1 ? `<div class="tiers">${tiers.map(t => `<div class="tier ${t === d.ticket ? "me" : ""}">${t === d.ticket ? `<span class="you">Your price</span>` : ""}<b>${euro(d.tiers[t])}</b>${names[t]}${until[t] ? `<br><span style="font-size:12px;opacity:.8">${until[t]}</span>` : ""}</div>`).join("")}</div>` : ""}
      </div>
      ${d.deadline ? `<div class="deadline">${overdue ? "The payment deadline has passed. DM us on Instagram if you already paid." : `Pay before <span>${esc(when(d.deadline))}</span>. After that your place goes back to the list.`}</div>` : ""}
      <div class="card">
        <h2 style="font-size:30px">How to pay</h2>
        <ol class="howto">
          <li><div><h3>Open your banking app</h3><p>Make a normal bank transfer (bonifico) of exactly this amount.</p>
            <div class="fbox"><div><span class="k">Amount</span><span class="v">${euro(d.price)}</span></div>${copyBtn(String(d.price).replace(".", ","))}</div></div></li>
          <li><div><h3>Send it to</h3><p>Copy these into your transfer.</p>
            <div class="fbox"><div><span class="k">IBAN</span><span class="v">${esc(d.iban ? d.iban.replace(/\s+/g, "").replace(/(.{4})/g, "$1 ").trim() : "—")}</span></div>${d.iban ? copyBtn(d.iban.replace(/\s+/g, "")) : ""}</div>
            <div class="fbox"><div><span class="k">Beneficiary</span><span class="v">${esc(d.beneficiary || "—")}</span></div>${d.beneficiary ? copyBtn(d.beneficiary) : ""}</div></div></li>
          <li><div><h3>Write this in the description</h3><p>Exactly like this, so we can match your payment to you.</p>
            <div class="fbox dark"><div><span class="k">Description</span><span class="v">${esc(d.reference)}</span></div>${copyBtn(d.reference)}</div></div></li>
          <li><div><h3>Wait for our confirmation</h3><p>We check payments regularly. Once yours is in, this page shows your QR ticket and the exact location. Keep this link.</p></div></li>
        </ol>
        <button class="btn ink copyall" type="button" data-copy="${esc(allText)}">Copy all payment details</button>
      </div>
      <p class="note">Your personal code: <b style="font-family:var(--f-mono)">${esc(d.code)}</b> · Questions? DM <a href="https://ig.me/m/perugiaparty" target="_blank" rel="noopener">@perugiaparty</a>.</p>`;
  } else if (d.status === "paid" || d.status === "in") {
    const inside = d.status === "in";
    P.innerHTML = `<div class="hype">
        <span class="state in">${inside ? "✓ Checked in" : "✓ Paid · confirmed"}</span>
        <h1>${inside ? `You made it, <em>${first}</em>.` : `It's official, <em>${first}</em>. You're on the list.`}</h1>
        <p class="lead">${inside ? "Enjoy the night. You're exactly where you should be." : `<b style="color:var(--cream)">${esc(d.event)}</b> is happening and you're in. Your people. Your night.`}</p>
        <div class="count" id="tcount" ${inside ? 'style="display:none"' : ""} hidden></div>
      </div>
      ${inside ? `<div class="inbar" role="status"><span class="tick">✓</span><div><b>Checked in</b><span>${d.in_at ? "Entered at " + new Date(d.in_at).toLocaleTimeString("it-IT", { hour:"2-digit", minute:"2-digit", timeZone:"Europe/Rome" }) + ". " : ""}This ticket has been used.</span></div></div>` : ""}
      <div class="cine">
        <span class="holes t" aria-hidden="true"></span><span class="holes b" aria-hidden="true"></span>
        ${inside ? `<span class="instamp">CHECKED IN ✓</span>` : ""}
        <img class="logo" src="/logo.png" alt="PerugiaParty">
        <div><p class="ev">${esc(d.event)}</p><p class="meta">${esc([d.date_label, d.doors && "doors " + d.doors].filter(Boolean).join(" · "))}</p></div>
        <div class="perf" aria-hidden="true"></div>
        <div class="qr"><canvas id="qr" aria-label="Your entry QR code"></canvas></div>
        <p class="code">${esc(d.code)}</p>
        <p class="who">${esc(d.name)}</p>
        <p class="meta">Show this QR and your photo ID at the door</p>
      </div>
      ${d.location ? `<div class="where"><div><span class="eyebrow" style="color:#f3d3cc">The place</span><p>${esc(d.location)}</p></div><a class="btn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d.location)}" target="_blank" rel="noopener">Directions ↗</a></div>` : ""}
      <div class="actions">
        <button class="btn" type="button" id="pdf">Download ticket (PDF)</button>
        <button class="btn ink" type="button" id="share">Tell your friends</button>
        ${d.starts_at ? `<button class="btn outline" type="button" id="cal">Add to calendar</button>` : ""}
        <button class="btn outline" type="button" data-copy="${esc(location.href)}">Copy my ticket link</button>
      </div>
      <p class="note">Your ticket is personal: one entry, checked at the door. Save the PDF in case there's no signal.</p>`;
    try { drawQR(d.qr, $("qr")); } catch (e) { $("qr").parentElement.innerHTML = `<p style="color:#111;padding:20px;font-family:var(--f-mono)">${esc(d.code)}</p>`; }
    $("pdf").addEventListener("click", e => downloadTicket(d, e.currentTarget));
    $("share").addEventListener("click", e => shareParty(d, e.currentTarget));
    if ($("cal")) $("cal").addEventListener("click", () => addToCalendar(d));
    startCount(d.starts_at);
  } else if (d.status === "declined") {
    empty("Not this time.", "We couldn't give you a place for this edition. Keep an eye on Instagram for the next one.");
  } else if (d.status === "released") {
    empty("Your place was released.", "The payment deadline passed, so your place went back to the list. DM us on Instagram if you think this is a mistake.");
  } else {
    empty("Something's off.", "We couldn't read this ticket. DM us on Instagram and we'll sort it out.");
  }
}

if (!token) {
  empty("No ticket here yet.", "Request a place first. You'll get a personal link that leads back to this page.");
} else {
  // live updates: check every 20 s while the page is open, and when the guest comes back to it
  let last = null, busy = false;
  const STATUS_TEXT = { approved: "You've been accepted. Your payment details are below.", paid: "Payment confirmed. Your ticket and the location are here.", in: "You're checked in. Have a great night.", declined: "Your request was updated.", released: "Your request was updated." };
  async function check(first){
    if (busy) return; busy = true;
    try {
      const r = await fetch("/api/ticket?t=" + encodeURIComponent(token), { cache: "no-store" });
      const d = await r.json();
      if (!r.ok) { if (first) empty("We couldn't find this ticket.", esc(d.error || "Check that you opened the full link we gave you.")); return; }
      const sig = JSON.stringify(d);
      if (sig === last) return;
      const prev = last ? JSON.parse(last).status : null;
      last = sig;
      render(d);
      if (prev && prev !== d.status) { notify(STATUS_TEXT[d.status] || "Your page just updated."); window.scrollTo({ top: 0, behavior: "smooth" }); }
    } catch (e) {
      if (first) empty("Couldn't load your ticket.", "Check your connection and refresh the page.");
    } finally { busy = false; }
  }
  function notify(msg){
    let n = document.getElementById("live-note");
    if (!n) { n = document.createElement("div"); n.id = "live-note"; n.setAttribute("role", "status"); document.body.appendChild(n); }
    n.textContent = msg; n.className = "show";
    clearTimeout(notify.t); notify.t = setTimeout(() => n.className = "", 5000);
  }
  check(true);
  setInterval(() => { if (document.visibilityState === "visible") check(false); }, 20000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") check(false); });
}
</script>
</body>
</html>
